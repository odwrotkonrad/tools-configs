min_version: 2.1.9

output:
  - summary
  - failure
  - execution_info

pre-commit:
  parallel: false
  jobs:
    - name: ssh-authenticate
      run: ~/.config/lefthook/scripts/ssh_authenticate

    - name: validate-yml
      glob: "*.{yml,yaml}"
      run: yq e '.' {staged_files}

commit-msg:
  jobs:
    - name: conventional-prefix
      run: ~/.config/lefthook/scripts/conventional_prefix {1}
