#>[⌖]
# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
#/[⌖]

apiVersion: 1

datasources:
  #[≟] Prometheus — metrics scraped from otelcol (8889) + prometheus self (9090).
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true

  #[≟] Loki — logs OTLP backend.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://localhost:3100

  #[≟] Jaeger — traces, served by the jaeger_query extension in otelcol.
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://localhost:16686
