#>[⌖]
# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
#/[⌖]

apiVersion: 1

datasources:
  #[≟] Prometheus — metrics scraped from otelcol (8889) + prometheus self (9090).
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true

  #[≟] Loki — logs OTLP backend.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"

  #[≟] Jaeger — traces, served by the jaeger_query extension in otelcol.
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://localhost:16686
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
        filterByTraceID: true
        customQuery: true
        query: '{service_name="claude-code"} | trace_id="$${__trace.traceId}"'
