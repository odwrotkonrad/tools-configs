#>[⌖]
# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
#/[⌖]

[paths]
data = /Users/ko/.local/state/grafana
logs = /Users/ko/.local/state/log
provisioning = /etc/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 9300

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[users]
default_theme = dark

[auth]
disable_login = true
disable_login_form = true
disable_signout_menu = true

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/host-status.json

[help]
enabled = false

[profile]
enabled = false

[news]
news_feed_enabled = false

[snapshots]
enabled = false

[auth.anonymous]
enabled = true
org_role = Admin

[panels]
disable_sanitize_html = true
