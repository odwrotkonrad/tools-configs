min_version: 2.1.9

output:
  - summary
  - failure
  - execution_info

pre-commit:
  parallel: false
  jobs:
    - name: ssh-authenticate
      run: /usr/local/scripts/shell/s-root-ssh-authenticate

    - name: validate-yml
      glob: "*.{yml,yaml}"
      run: yq e '.' {staged_files}

    - name: ruff
      glob: "*.py"
      run: ruff check --select I --fix {staged_files} && ruff format {staged_files} && git add {staged_files}

commit-msg:
  jobs:
    - name: conventional-prefix
      run: /usr/local/scripts/shell/s-root-conventional-prefix {1}
