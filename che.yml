profiles:
  desktop:
    macos:
  cli:
    macos:
    linux:

base:
  include:
    link:
      - HOME/**
      - etc/**
      - usr/**
    copy:
      - files: [HOME/**, etc/**, usr/**]
      - owner: root
        owner-group: wheel
        chmod: "0644"
        files:
          - {source: Library/LaunchDaemons/otelcol.plist.host.cp, dest: [/Library/LaunchDaemons/otelcol.plist]}
          - {source: Library/LaunchDaemons/dir-size-exporter.plist.host.cp, dest: [/Library/LaunchDaemons/dir-size-exporter.plist]}
          - {source: Library/LaunchDaemons/port-exporter.plist.host.cp, dest: [/Library/LaunchDaemons/port-exporter.plist]}
          - {source: Library/LaunchDaemons/grafana.plist.host.cp, dest: [/Library/LaunchDaemons/grafana.plist]}
          - {source: Library/LaunchDaemons/prometheus.plist.host.cp, dest: [/Library/LaunchDaemons/prometheus.plist]}
          - {source: Library/LaunchDaemons/jaeger.plist.host.cp, dest: [/Library/LaunchDaemons/jaeger.plist]}
          - {source: Library/LaunchDaemons/loki.plist.host.cp, dest: [/Library/LaunchDaemons/loki.plist]}
    template:
      - files: [HOME/**, etc/**, usr/**]
      - owner: root
        owner-group: wheel
        chmod: "0440"
        files:
          - {source: etc/sudoers.d/configs.host.tpl, dest: [/etc/sudoers.d/configs]}
      - owner: root
        owner-group: wheel
        chmod: "0644"
        files:
          - {source: Library/LaunchAgents/gitlab-runner.plist.host.tpl, dest: [/Library/LaunchAgents/gitlab-runner.plist]}
      - files:
          - source: HOME/.config/agents/templates/AGENTS.md.host.tpl
            dest:
              - ~/.config/claude/CLAUDE.md
              - {path: ~/.config/codex/AGENTS.md, render-referenced-files: true}
    mkdirs:
      - files:
          - HOME/.cache/{zsh,homebrew,get-term-open-files-with}
          - HOME/.config/codex
          - HOME/.local/{bin,share}
          - HOME/.local/state/{asdf,codex/log,homebrew,log,vim/undo,zsh/completions}
          - HOME/ScreenCapture
          - /var/root/.cache/zsh
          - /var/root/.config
          - /var/root/.local/state/zsh/completions
      - chmod: "2775"
        files:
          - {dest: ["/var/log/{otelcol,dir_size_exporter,port_exporter}"]}
          - {dest: ["/var/custom/cache/dir_size_exporter"]}
          - {dest: ["/var/log/{grafana,prometheus,jaeger,loki}"]}
          - {dest: ["/usr/local/var/{grafana,prometheus}"]}
      - owner: root
        owner-group: wheel
        chmod: "0755"
        files:
          - {dest: [/etc/zsh/zshrc.d/completions]}
    install:
      - ci/zsh/scripts/installs/*.zsh
      - ci/zsh/scripts/bootstrap/*.zsh
    services: [otelcol, dir-size-exporter, port-exporter, grafana, prometheus, jaeger, loki, gitlab-runner]

base-exclude-desktop:
  exclude:
    link:
      - HOME/.gitlab-runner/**
      - HOME/Library/**
      - etc/{grafana,prometheus,jaeger,loki}/**
    copy:
      - Library/LaunchDaemons/{grafana,prometheus,jaeger,loki}.plist*
    template:
      - HOME/.gitlab-runner/**
      - HOME/Library/**
      - Library/LaunchAgents/gitlab-runner.plist*
    mkdirs:
      - /var/log/{grafana,prometheus,jaeger,loki}
      - /usr/local/var/{grafana,prometheus}
    services: [grafana, prometheus, jaeger, loki, gitlab-runner]

base-exclude-macos:
  exclude:
    link:
      - etc/defaults.yml

desktop/macos:
  mixin-profiles: [base]

cli/macos:
  mixin-profiles: [base, base-exclude-desktop]

cli/linux:
  mixin-profiles: [base, base-exclude-macos, base-exclude-desktop]
