profiles:
  bare-metal:
    mac-os-aarch64:
  virt:
    mac-os-aarch64:
    linux-aarch64:
    linux-x86:

base:
  load-configuration:
    Library/LaunchDaemons/d-root-otelcol.plist*:
    Library/LaunchDaemons/d-root-dir-size-exporter.plist*:
    Library/LaunchDaemons/d-root-port-exporter.plist*:
  make-extra-dirs:
    - /var/log/{otelcol,dir_size_exporter,port_exporter}
    - /var/custom/cache/dir_size_exporter
    - /var/custom/cache/get-term-open-files-with
  install:
    - ci/zsh/scripts/installs/shared/golang
    - ci/zsh/scripts/installs/shared/otel-collector

base-cli:
  include-profiles: [base]
  load-configuration:
    HOME/**:
    etc/**:
    usr/**:
  exclude:
    load-configuration:
      - HOME/.gitlab-runner/**
      - HOME/Library/**
      - etc/defaults.yml
      - etc/grafana/**
      - etc/prometheus/**
      - etc/jaeger/**
      - etc/loki/**
  make-extra-dirs:
    - HOME/.cache/{zsh,homebrew}
    - HOME/.config/codex
    - HOME/.local/{bin,share}
    - HOME/.local/state/{asdf,codex/log,homebrew,log,vim/undo,zsh/completions}
    - HOME/ScreenCapture
    - /var/root/.cache/zsh
    - /var/root/.config
    - /var/root/.local/state/zsh/completions
  install:
    - ci/zsh/scripts/installs/shared/aws-cli
    - ci/zsh/scripts/installs/shared/gcloud-cli
    - ci/zsh/scripts/installs/shared/native-clis

base-macos:
  include-profiles: [base-cli]
  load-configuration:
    etc/defaults.yml:

base-macos-cli:
  include-profiles: [base-macos]
  install:
    - ci/zsh/scripts/installs/mac/brew
    - ci/zsh/scripts/installs/mac/brew-packages
    - ci/zsh/scripts/installs/mac/asdf-tools
    - ci/zsh/scripts/installs/mac/pyenv-python
    - ci/zsh/scripts/installs/mac/lang-pkgs
    - ci/zsh/scripts/installs/shared/completions-zsh

base-desktop:
  include-profiles: [base-macos-cli]
  load-configuration:
    HOME/.gitlab-runner/**:
    HOME/Library/**:
    etc/{grafana,prometheus,jaeger,loki}/**:
    Library/LaunchDaemons/d-root-{grafana,prometheus,jaeger,loki}.plist*:
    Library/LaunchAgents/d-user-gitlab-runner.plist*:
  make-extra-dirs:
    - /var/log/{grafana,prometheus,jaeger,loki}
    - /usr/local/var/{grafana,prometheus}
  install:
    - ci/zsh/scripts/installs/mac/kitty
    - ci/zsh/scripts/installs/mac/vscode-exts
    - ci/zsh/scripts/installs/shared/ollama
    - ci/zsh/scripts/installs/mac/jaeger
    - ci/zsh/scripts/installs/mac/prometheus
    - ci/zsh/scripts/installs/mac/gitlab-runner

virt/mac-os-aarch64:
  include-profiles: [base-macos-cli]

bare-metal/mac-os-aarch64:
  include-profiles: [base-desktop]
