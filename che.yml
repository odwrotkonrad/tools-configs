# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
#[why] the package set alone, no makeDirs/runScripts: those bind to a configs checkout ($PWD/ci,
#   ci/zsh/scripts/installs), which an image build composing profiles from a remote ref has not got.
#   split out so such a build can pull the base packages without the checkout-bound ops
base/packages:
  include:
    installPackages:
      - bat
      - bats
      - che
      - copilot
      - corepack
      - fd
      - ffmpeg
      - gcc
      - htop
      - jq
      - lefthook
      - libtool
      - make
      - nmap
      - openssl
      - pandoc
      - pcre2
      - pkgconf
      - procs
      - pstree
      - readline
      - shellcheck
      - showkey
      - sqlite3
      - stow
      - tcl
      - tree
      - unzip
      - watch
      - xz
      - yq
      - zlib
      - zstd

base:
  include:
    profiles:
      - base/packages
    makeDirs:
      - chmod: "0755"
        directories:
          - dest:
              - $PWD/ci
          - dest:
              - $PWD/ci/zsh
          - dest:
              - $PWD/ci/zsh/functions
    runScripts:
      - ci/zsh/scripts/installs/*.zsh

desktop/macos:
  options:
    autoDiscover: true
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt == false
  include:
    profiles:
      - base
      - source: "profiles/shell/che.yml::shell/host/macos"
      - source: "profiles/misc/che.yml::misc/host/macos"
      - source: "profiles/git/che.yml::git/host/macos"
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ env.AI_TOOLS_CONFIGS_REF }}//che.yml::ai/host/macos"
      - source: "profiles/dev/che.yml::dev/host/macos"
      - source: "profiles/cloud/che.yml::cloud/host/macos"
      - source: "profiles/gitlab/che.yml::gitlab/host/macos"
      - source: "profiles/observability/che.yml::observability/host/macos"

cli/macos:
  options:
    autoDiscover: true
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt
  include:
    profiles:
      - base
      - source: "profiles/shell/che.yml::shell/base/macos"
      - source: "profiles/misc/che.yml::misc/base/macos"
      - source: "profiles/git/che.yml::git/base/macos"
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ env.AI_TOOLS_CONFIGS_REF }}//che.yml::ai/base/macos"
      - source: "profiles/dev/che.yml::dev/base/macos"
      - source: "profiles/cloud/che.yml::cloud/base/macos"
      - source: "profiles/gitlab/che.yml::gitlab/base/macos"
      - source: "profiles/observability/che.yml::observability/base/macos"

virt/linux:
  options:
    autoDiscover: true
    runIf:
      - builtin:isOs == linux
  include:
    profiles:
      - base
      - source: "profiles/shell/che.yml::shell/virt/linux"
      - source: "profiles/misc/che.yml::misc/virt/linux"
      - source: "profiles/git/che.yml::git/virt/linux"
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ env.AI_TOOLS_CONFIGS_REF }}//che.yml::ai/virt/linux"
      - source: "profiles/dev/che.yml::dev/virt/linux"
      - source: "profiles/cloud/che.yml::cloud/virt/linux"
      - source: "profiles/gitlab/che.yml::gitlab/virt/linux"
      - source: "profiles/observability/che.yml::observability/virt/linux"
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ env.AI_TOOLS_CONFIGS_REF }}//profiles/claude/che.yml::claude/virt"

ontoRepo:
  include:
    profiles:
      - source: ".repo/che.yml::repo/genfiles"

envSeed:
  include:
    profiles:
      - source: ".repo/che.yml::envSeed"

#[why] os-agnostic and ungated, like ontoRepo: indexing reads dirs already on disk, so `make
#   host-index-workspace` refreshes the workspace map with no credential and no network
indexWorkspace:
  include:
    profiles:
      - source: "profiles/gitlab/che.yml::gitlab/projects-index"

bootstrapCrossRepoCI:
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/cross-repo/misc@${{ env.MISC_REF }}//che.yml::bootstrapCrossRepoCITagging"

