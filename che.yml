# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

base:
  include:
    makeLinks:
      - {source: _home/**, dest: $HOME/**}
      - etc/**
      - usr/**
    makeCopies:
      - files: [{source: _home/**, dest: $HOME/**}, etc/**, usr/**]
    renderTemplates:
      - templates: [{source: _home/**, dest: $HOME/**}, etc/**, usr/**]
      - owner: root
        ownerGroup: "0"
        chmod: "0440"
        templates:
          - {source: etc/sudoers.d/configs.ontoHost.tpl, dest: [/etc/sudoers.d/configs]}
    makeDirs:
      - directories:
          - {dest: ["$HOME/.cache/{homebrew,get-term-open-files-with}"]}
          - {dest: [$HOME/.config/codex]}
          - {dest: ["$HOME/.local/{bin,share}"]}
          - {dest: [$HOME/.local/state/che/backups]}
          - {dest: ["$HOME/.local/state/{homebrew,log,vim/undo}"]}
          - {dest: [$HOME/ScreenCapture]}
          - {dest: [/var/root/.config]}
    runScripts:
      - ci/zsh/scripts/installs/*.zsh
      - ci/zsh/scripts/bootstrap/*.zsh

base-exclude-desktop:
  exclude:
    makeLinks:
      - _home/Library/**
    renderTemplates:
      - _home/Library/**
    runScripts:
      - ci/zsh/scripts/installs/80-go-host-tools.zsh

base-exclude-macos:
  exclude:
    makeLinks:
      - etc/defaults.yml

desktop/macos:
  options: {autoDiscover: true, runIf: ['builtin:isOs == macos', 'builtin:isVirt == false']}
  include:
    profiles:
      - base
      - source: "profiles/shell/che.yml::shell/host/macos"
      - source: "profiles/misc/che.yml::misc/host/macos"
      - source: "profiles/git/che.yml::git/host/macos"
      - source: "profiles/llm/che.yml::llm/host/macos"
      - source: "profiles/dev/che.yml::dev/host/macos"
      - source: "profiles/cloud/che.yml::cloud/host/macos"
      - source: "profiles/gitlab/che.yml::gitlab/host/macos"
      - source: "profiles/observability/che.yml::observability/host/macos"

cli/macos:
  options: {autoDiscover: true, runIf: ['builtin:isOs == macos', 'builtin:isVirt']}
  include:
    profiles:
      - base
      - base-exclude-desktop
      - source: "profiles/shell/che.yml::shell/base/macos"
      - source: "profiles/misc/che.yml::misc/base/macos"
      - source: "profiles/git/che.yml::git/base/macos"
      - source: "profiles/llm/che.yml::llm/base/macos"
      - source: "profiles/dev/che.yml::dev/base/macos"
      - source: "profiles/cloud/che.yml::cloud/base/macos"
      - source: "profiles/gitlab/che.yml::gitlab/base/macos"
      - source: "profiles/observability/che.yml::observability/base/macos"

cli/linux:
  options: {autoDiscover: true, runIf: ['builtin:isOs == linux']}
  include:
    profiles:
      - base
      - base-exclude-macos
      - base-exclude-desktop
      - source: "profiles/shell/che.yml::shell/virt/linux"
      - source: "profiles/misc/che.yml::misc/virt/linux"
      - source: "profiles/git/che.yml::git/virt/linux"
      - source: "profiles/llm/che.yml::llm/virt/linux"
      - source: "profiles/dev/che.yml::dev/virt/linux"
      - source: "profiles/cloud/che.yml::cloud/virt/linux"
      - source: "profiles/gitlab/che.yml::gitlab/virt/linux"
      - source: "profiles/observability/che.yml::observability/virt/linux"

claude-agents:
  options: {autoDiscover: true, runIf: ['builtin:isVirt']}
  include:
    profiles:
      - source: "profiles/llm/claude/che.yml::claude-agents"

ontoRepo:
  include:
    renderTemplates:
      - templates:
          - source: templates/1-env/local.env.ontoRepo.tpl
            dest:
              - {path: .env, options: {writeType: mergeUpsert}}
          - {source: templates/2-data/makefile-agents.md.ontoRepo.tpl, dest: [assets/data/makefile.agents.md]}
          - {source: templates/2-data/repo-structure.md.ontoRepo.tpl, dest: [assets/data/repo-structure.md]}
          - {source: templates/3-audience/README.md.ontoRepo.tpl, dest: [README.md]}
          - source: templates/3-audience/AGENTS.md.ontoRepo.tpl
            dest:
              - CLAUDE.md
              - {path: AGENTS.md, options: {renderReferencedFiles: true}}
          - {source: ci/vm/macos-tahoe-vanilla-base.local.pkrvars.hcl.ontoRepo.tpl, dest: [ci/vm/macos-tahoe-vanilla-base.local.pkrvars.hcl]}
          - {source: ci/vm/macos-tahoe-vanilla-configs.local.pkrvars.hcl.ontoRepo.tpl, dest: [ci/vm/macos-tahoe-vanilla-configs.local.pkrvars.hcl]}
##[<] 🤖🤖
