# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root
zsh/base:
  include:
    profiles:
      - source: "tools/zsh/base/che.yml::zsh/base-macos"
      - source: "tools/zsh/base/che.yml::zsh/base-linux"

zsh/base-linux:
  include:
    profiles:
      - source: "tools/zsh/base/che.yml::zsh/base-linux"

zsh/extras:
  include:
    profiles:
      - source: "tools/zsh/extras/che.yml::zsh/extras"

git:
  include:
    profiles:
      - source: "tools/git/che.yml::git"

ssh:
  include:
    profiles:
      - source: "tools/ssh/che.yml::ssh"
      - source: "tools/ssh/che.yml::ssh/virt"

gitlab/glab:
  include:
    profiles:
      - source: "tools/gitlab/glab/che.yml::gitlab/glab"

gitlab/projects:
  include:
    profiles:
      - source: "tools/gitlab/projects/che.yml::gitlab/projects"

gitlab/runner:
  include:
    profiles:
      - source: "tools/gitlab/runner/che.yml::gitlab/runner"

base:
  include:
    profiles:
      - zsh/base
      - zsh/extras
      - git
      - ssh
      - gitlab/glab
      - gitlab/runner
      - source: "tools/gitlab/projects/che.yml::gitlab/projects"
        env:
          GITLAB_GROUPS: "konradodwrot:konradodwrot;restricted:restricted"
      - source: "tools/gitlab/projects/che.yml::gitlab/projects-parent-links"
    makeLinks:
      - {source: _home/**, dest: $HOME/**}
      - etc/**
      - usr/**
    makeCopies:
      - files: [{source: _home/**, dest: $HOME/**}, etc/**, usr/**]
      - owner: root
        ownerGroup: "0"
        chmod: "0644"
        files:
          - {source: Library/LaunchDaemons/otelcol.plist.ontoHost.cp, dest: [/Library/LaunchDaemons/otelcol.plist]}
          - {source: Library/LaunchDaemons/dir-size-exporter.plist.ontoHost.cp, dest: [/Library/LaunchDaemons/dir-size-exporter.plist]}
          - {source: Library/LaunchDaemons/port-exporter.plist.ontoHost.cp, dest: [/Library/LaunchDaemons/port-exporter.plist]}
          - {source: Library/LaunchDaemons/grafana.plist.ontoHost.cp, dest: [/Library/LaunchDaemons/grafana.plist]}
          - {source: Library/LaunchDaemons/prometheus.plist.ontoHost.cp, dest: [/Library/LaunchDaemons/prometheus.plist]}
          - {source: Library/LaunchDaemons/jaeger.plist.ontoHost.cp, dest: [/Library/LaunchDaemons/jaeger.plist]}
          - {source: Library/LaunchDaemons/loki.plist.ontoHost.cp, dest: [/Library/LaunchDaemons/loki.plist]}
    renderTemplates:
      - templates: [{source: _home/**, dest: $HOME/**}, etc/**, usr/**]
      - owner: root
        ownerGroup: "0"
        chmod: "0440"
        templates:
          - {source: etc/sudoers.d/configs.ontoHost.tpl, dest: [/etc/sudoers.d/configs]}
      - templates:
          - source: _home/.config/agents/templates/AGENTS.md.ontoHost.tpl
            dest:
              - ~/.config/claude/CLAUDE.md
              - {path: ~/.config/codex/AGENTS.md, options: {renderReferencedFiles: true}}
    makeDirs:
      - directories:
          - {dest: ["$HOME/.cache/{homebrew,get-term-open-files-with}"]}
          - {dest: [$HOME/.config/codex]}
          - {dest: ["$HOME/.local/{bin,share}"]}
          - {dest: [$HOME/.local/state/che/backups]}
          - {dest: ["$HOME/.local/state/{asdf,codex/log,homebrew,log,vim/undo}"]}
          - {dest: [$HOME/ScreenCapture]}
          - {dest: [/var/root/.config]}
      - chmod: "2775"
        directories:
          - {dest: ["/var/log/{otelcol,dir_size_exporter,port_exporter}"]}
          - {dest: ["/var/custom/cache/dir_size_exporter"]}
          - {dest: ["/var/log/{grafana,prometheus,jaeger,loki}"]}
          - {dest: ["/usr/local/var/{grafana,prometheus}"]}
    runScripts:
      - ci/zsh/scripts/installs/*.zsh
      - ci/zsh/scripts/bootstrap/*.zsh

base-exclude-desktop:
  exclude:
    makeLinks:
      - _home/Library/**
      - etc/{grafana,prometheus,jaeger,loki}/**
    makeCopies:
      - Library/LaunchDaemons/{grafana,prometheus,jaeger,loki}.plist*
    renderTemplates:
      - _home/Library/**
      #[why] 🤖🤖 cli/linux-only excludes (cli/macos does not include base-exclude-desktop): the sandbox authenticates to google via ADC (GOOGLE_APPLICATION_CREDENTIALS), not gcloud/aws config files, and the quota project is hardcoded in that profile's 10-params branch: no op:// dependency remains in the pod
      - _home/.config/gcloud/**
      - _home/.config/aws/config.ontoHost.tpl
    makeDirs:
      - /var/log/{grafana,prometheus,jaeger,loki}
      - /usr/local/var/{grafana,prometheus}
    runScripts:
      - ci/zsh/scripts/installs/80-go-host-tools.zsh

base-exclude-macos:
  exclude:
    makeLinks:
      - etc/defaults.yml
      - _home/.config/homebrew/trust.json

desktop/macos:
  options: {autoDiscover: true, runIf: ['builtin:isOs == macos', 'builtin:isVirt == false']}
  include:
    profiles: [base]

cli/macos:
  options: {autoDiscover: true, runIf: ['builtin:isOs == macos', 'builtin:isVirt']}
  include:
    profiles: [base, base-exclude-desktop]

cli/linux:
  options: {autoDiscover: true, runIf: ['builtin:isOs == linux']}
  include:
    profiles: [base, base-exclude-macos, base-exclude-desktop]

claude-agents:
  options: {autoDiscover: true, runIf: ['builtin:isVirt']}
  include:
    renderTemplates:
      - ctx: {repo: Configs}
        templates:
          - {source: "@gitlab.com/konradodwrot/configs//templates/agents/snippets/ro.md", dest: [{path: .claude/agents/ro.md, options: {skipAutoGeneratedHeader: true}}]}
          - {source: "@gitlab.com/konradodwrot/configs//templates/agents/snippets/rw.md", dest: [{path: .claude/agents/rw.md, options: {skipAutoGeneratedHeader: true}}]}
          - {source: "@gitlab.com/konradodwrot/configs//templates/agents/snippets/settings.json", dest: [{path: .claude/settings.json, options: {skipAutoGeneratedHeader: true}}]}
          - {source: "@gitlab.com/konradodwrot/configs//templates/agents/snippets/claude-gitignore", dest: [.claude/.gitignore]}

ontoRepo:
  include:
    renderTemplates:
      - templates:
          - source: templates/1-env/local.env.ontoRepo.tpl
            dest:
              - {path: .env, options: {writeType: mergeUpsert}}
          - {source: templates/2-data/makefile-agents.md.ontoRepo.tpl, dest: [assets/data/makefile.agents.md]}
          - {source: templates/2-data/repo-structure.md.ontoRepo.tpl, dest: [assets/data/repo-structure.md]}
          - {source: templates/3-audience/README.md.ontoRepo.tpl, dest: [README.md]}
          - source: templates/3-audience/AGENTS.md.ontoRepo.tpl
            dest:
              - CLAUDE.md
              - {path: AGENTS.md, options: {renderReferencedFiles: true}}
          - {source: ci/vm/macos-tahoe-vanilla-base.local.pkrvars.hcl.ontoRepo.tpl, dest: [ci/vm/macos-tahoe-vanilla-base.local.pkrvars.hcl]}
          - {source: ci/vm/macos-tahoe-vanilla-configs.local.pkrvars.hcl.ontoRepo.tpl, dest: [ci/vm/macos-tahoe-vanilla-configs.local.pkrvars.hcl]}
##[<] 🤖🤖
