profiles:
  desktop:
    macos:
  cli:
    macos:
    linux:

base:
  include:
    link:
      - HOME/**
      - etc/**
      - usr/**
    copy:
      - HOME/**
      - etc/**
      - usr/**
      - source: Library/LaunchDaemons/otelcol.plist.host.cp
        dest: [{path: /Library/LaunchDaemons/otelcol.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
      - source: Library/LaunchDaemons/dir-size-exporter.plist.host.cp
        dest: [{path: /Library/LaunchDaemons/dir-size-exporter.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
      - source: Library/LaunchDaemons/port-exporter.plist.host.cp
        dest: [{path: /Library/LaunchDaemons/port-exporter.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
      - source: Library/LaunchDaemons/grafana.plist.host.cp
        dest: [{path: /Library/LaunchDaemons/grafana.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
      - source: Library/LaunchDaemons/prometheus.plist.host.cp
        dest: [{path: /Library/LaunchDaemons/prometheus.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
      - source: Library/LaunchDaemons/jaeger.plist.host.cp
        dest: [{path: /Library/LaunchDaemons/jaeger.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
      - source: Library/LaunchDaemons/loki.plist.host.cp
        dest: [{path: /Library/LaunchDaemons/loki.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
    template:
      - HOME/**
      - etc/**
      - usr/**
      - source: etc/sudoers.d/configs.host.tpl
        dest: [{path: /etc/sudoers.d/configs}]
        owner: root
        owner-group: wheel
        chmod: "0440"
      - source: Library/LaunchAgents/gitlab-runner.plist.host.tpl
        dest: [{path: /Library/LaunchAgents/gitlab-runner.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
      - source: HOME/.config/agents/templates/AGENTS.md.host.tpl
        dest:
          - {path: ~/.config/claude/CLAUDE.md, render-referenced-files: true}
          - {path: ~/.config/codex/AGENTS.md, render-referenced-files: true}
    mkdirs:
      - dest: [{path: "/var/log/{otelcol,dir_size_exporter,port_exporter}"}]
        chmod: "2775"
      - dest: [{path: "/var/custom/cache/dir_size_exporter"}]
        chmod: "2775"
      - dest: [{path: "/var/log/{grafana,prometheus,jaeger,loki}"}]
        chmod: "2775"
      - dest: [{path: "/usr/local/var/{grafana,prometheus}"}]
        chmod: "2775"
      - HOME/.cache/{zsh,homebrew,get-term-open-files-with}
      - HOME/.config/codex
      - HOME/.local/{bin,share}
      - HOME/.local/state/{asdf,codex/log,homebrew,log,vim/undo,zsh/completions}
      - HOME/ScreenCapture
      - /var/root/.cache/zsh
      - /var/root/.config
      - /var/root/.local/state/zsh/completions
    install:
      - ci/zsh/scripts/installs/*.zsh
    services: [otelcol, dir-size-exporter, port-exporter, grafana, prometheus, jaeger, loki, gitlab-runner]

base-exclude-desktop:
  exclude:
    link:
      - HOME/.gitlab-runner/**
      - HOME/Library/**
      - etc/{grafana,prometheus,jaeger,loki}/**
    copy:
      - Library/LaunchDaemons/{grafana,prometheus,jaeger,loki}.plist*
    template:
      - HOME/.gitlab-runner/**
      - HOME/Library/**
      - Library/LaunchAgents/gitlab-runner.plist*
    mkdirs:
      - /var/log/{grafana,prometheus,jaeger,loki}
      - /usr/local/var/{grafana,prometheus}
    services: [grafana, prometheus, jaeger, loki, gitlab-runner]

base-exclude-macos:
  exclude:
    link:
      - etc/defaults.yml

desktop/macos:
  mixin-profiles: [base]

cli/macos:
  mixin-profiles: [base, base-exclude-desktop]

cli/linux:
  mixin-profiles: [base, base-exclude-macos, base-exclude-desktop]
