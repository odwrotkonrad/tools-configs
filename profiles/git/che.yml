# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

git:
  include:
    makeLinks:
      - {source: _home/**, dest: $HOME/**}
      - usr/**
    runScripts:
      - scripts/01-install-git.zsh

git/base/macos:
  options: {runIf: ['builtin:isOs == macos']}
  include:
    profiles:
      - source: "./che.yml::git"

git/host/macos:
  options: {runIf: ['builtin:isOs == macos', 'builtin:isVirt == false']}
  include:
    profiles:
      - git/base/macos

git/virt/linux:
  options: {runIf: ['builtin:isOs == linux']}
  include:
    profiles:
      - source: "./che.yml::git"
##[<] 🤖🤖
