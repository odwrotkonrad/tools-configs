# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  git:
    type: host
    include:
      makeLinks:
        - source: _home/**
          dest: $HOME/**
        - etc/**
        - usr/**
      installPackages:
        - git
        - gh
      runScripts:
        - scripts/02-install-completions.zsh

  'git/base/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
    include:
      profiles:
        - specDirPath: .
          profileName: git

  'git/host/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
        - builtin:isVirt == false
    include:
      profiles:
        - git/base/macos

  'git/virt/linux':
    type: host
    options:
      runIf:
        - builtin:isOs == linux
    include:
      profiles:
        - specDirPath: .
          profileName: git

##[<] 🤖🤖
