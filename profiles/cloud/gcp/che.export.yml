# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  'cloud/gcp/install':
    type: host
    include:
      makeLinks:
        - etc/**
      installPackages:
        - gcloud
      installToolPackages:
        gcloud:
          - gke-gcloud-auth-plugin

  'cloud/gcp/configs':
    type: host
    options:
      runIf:
        - builtin:isVirt == false
    include:
      makeLinks:
        - source: _home/**/zshenv.d/**
          dest: $HOME/**
      renderTemplates:
        - source: _home/**
          dest: $HOME/**

  'cloud/gcp/auth':
    type: host
    options:
      runIf:
        - builtin:isVirt
    include:
      runScripts:
        - scripts/10-check-auth.zsh

##[<] 🤖🤖