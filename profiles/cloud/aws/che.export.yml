# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

cloud/aws:
  include:
    installPackages:
      - aws

#[why] op:// template, real host only: virt (cli/macos vm, sandbox pod) has no op and no use for aws config
cloud/aws/configs:
  options:
    runIf:
      - builtin:isVirt == false
  include:
    renderTemplates:
      - source: _home/**
        dest: $HOME/**
##[<] 🤖🤖
