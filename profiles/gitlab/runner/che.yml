# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

gitlab/runner:
  options: {runIf: ['builtin:isOs == macos', 'builtin:isVirt == false']}
  include:
    renderTemplates:
      - {source: _home/**, dest: $HOME/**}
      - owner: root
        ownerGroup: "0"
        chmod: "0644"
        source: Library/LaunchAgents/gitlab-runner.plist.ontoHost.tpl
        dest: [{path: /Library/LaunchAgents/gitlab-runner.plist, options: {skipAutoGeneratedHeader: true}}]
    installPackages:
      - gitlab-runner
      - packer
      - tart
      - gitlab-tart-executor
    runScripts:
      - scripts/01-boot-service.zsh
##[<] 🤖🤖
