# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
observability/base/macos:
  options:
    runIf:
      - builtin:isOs == macos
  include:
    profiles:
      - source: "./otelcol/che.yml::observability/otelcol"

observability/host/macos:
  options:
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt == false
  include:
    profiles:
      - observability/base/macos
      - source: "./grafana/che.yml::observability/grafana"
      - source: "./prometheus/che.yml::observability/prometheus"
      - source: "./jaeger/che.yml::observability/jaeger"
      - source: "./loki/che.yml::observability/loki"
    runScripts:
      - scripts/01-boot-services.zsh

observability/virt/linux:
  options:
    runIf:
      - builtin:isOs == linux
  include:
    profiles:
      - source: "./otelcol/che.yml::observability/otelcol"
##[<] 🤖🤖
