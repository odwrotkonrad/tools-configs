# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  'observability/grafana':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
        - builtin:isVirt == false
    include:
      makeLinks:
        - etc/**
      installPackages:
        - grafana
      makeCopies:
        - owner: root
          ownerGroup: "0"
          chmod: "0644"
          source: Library/LaunchDaemons/grafana.plist.ontoHost.cp
          dest:
            - /Library/LaunchDaemons/grafana.plist
      makeDirs:
        - chmod: "2775"
          directories:
            - dest:
                - /var/log/grafana
            - dest:
                - /usr/local/var/grafana
      runScripts:
        - scripts/01-boot-service.zsh

##[<] 🤖🤖