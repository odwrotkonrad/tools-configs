#>[where]
# https://grafana.com/docs/loki/latest/configure/
#/[where]

##[>] 🤖🤖
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

common:
  instance_addr: 127.0.0.1
  path_prefix: /opt/homebrew/var/loki
  storage:
    filesystem:
      chunks_directory: /opt/homebrew/var/loki/chunks
      rules_directory: /opt/homebrew/var/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  #[why] claude-code logs raw API bodies + user prompts (OTEL_LOG_RAW_API_BODIES/OTEL_LOG_USER_PROMPTS), whose per-entry structured metadata exceeds loki's 64KiB default and wedges the ingester; raise the ceiling to absorb them
  max_structured_metadata_size: 512kb
##[<] 🤖🤖
