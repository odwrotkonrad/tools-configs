# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

observability/jaeger:
  options:
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt == false
  include:
    makeLinks:
      - etc/**
    makeCopies:
      - owner: root
        ownerGroup: "0"
        chmod: "0644"
        source: Library/LaunchDaemons/jaeger.plist.ontoHost.cp
        dest:
          - /Library/LaunchDaemons/jaeger.plist
    makeDirs:
      - chmod: "2775"
        directories:
          - dest:
              - /var/log/jaeger
    installPackages:
      - jaeger
    runScripts:
      - scripts/01-boot-service.zsh
##[<] 🤖🤖
