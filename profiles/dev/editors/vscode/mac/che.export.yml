# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  'dev/editors/vscode/mac':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
        - builtin:isVirt == false
    include:
      makeLinks:
        - source: _home/**
          dest: $HOME/**
      renderTemplates:
        - source: _home/**
          dest: $HOME/**
      installPackages:
        - code
        - font-jetbrains-mono
      installToolPackages:
        vscode:
          - anthropic.claude-code
          - charliermarsh.ruff
          - editorconfig.editorconfig
          - esbenp.prettier-vscode
          - golang.go
          - hoovercj.vscode-settings-cycler
          - mindaro-dev.file-downloader
          - ms-azuretools.vscode-containers
          - ms-kubernetes-tools.vscode-kubernetes-tools
          - ms-python.debugpy
          - ms-python.python
          - ms-python.vscode-python-envs
          - ms-vscode-remote.remote-containers
          - openai.chatgpt
          - redhat.vscode-yaml
          - tamasfe.even-better-toml
          - yzhang.markdown-all-in-one

##[<] 🤖🤖