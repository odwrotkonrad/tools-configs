# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
profilesDefinitions:
  'dev/base/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
    include:
      profiles:
        - specDirPath: ./misc/editorconfig
          profileName: dev/misc/editorconfig
        - specDirPath: ./python/python
          profileName: dev/python/python
        - specDirPath: ./python/mypy
          profileName: dev/python/mypy
        - specDirPath: ./python/ruff
          profileName: dev/python/ruff
        - specDirPath: ./infra/terraform
          profileName: dev/infra/terraform
        - specDirPath: ./infra/kubectl
          profileName: dev/infra/kubectl
        - specDirPath: ./infra/kubectx
          profileName: dev/infra/kubectx
        - specDirPath: ./infra/kind
          profileName: dev/infra/kind
        - specDirPath: ./infra/docker
          profileName: dev/infra/docker
        - specDirPath: ./infra/podman
          profileName: dev/infra/podman
        - specDirPath: ./infra/cilium
          profileName: dev/infra/cilium
        - specDirPath: ./golang
          profileName: dev/golang
        - specDirPath: ./ruby
          profileName: dev/ruby
        - specDirPath: ./js/node
          profileName: dev/js/node
        - specDirPath: ./js/nvm
          profileName: dev/js/nvm
        - specDirPath: ./js/pnpm
          profileName: dev/js/pnpm
        - specDirPath: ./js/prettier
          profileName: dev/js/prettier
        - specDirPath: ./terminal/tmux
          profileName: dev/terminal/tmux
        - specDirPath: ./editors/vim
          profileName: dev/editors/vim

  'dev/host/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
        - builtin:isVirt == false
    include:
      profiles:
        - dev/base/macos
        - specDirPath: ./editors/vscode/mac
          profileName: dev/editors/vscode/mac
        - specDirPath: ./terminal/kitty
          profileName: dev/terminal/kitty

  'dev/virt/linux':
    type: host
    options:
      runIf:
        - builtin:isOs == linux
    include:
      profiles:
        - specDirPath: ./terminal/kitty
          profileName: dev/terminal/kitty/terminfo
        - specDirPath: ./misc/editorconfig
          profileName: dev/misc/editorconfig
        - specDirPath: ./python/python
          profileName: dev/python/python
        - specDirPath: ./python/mypy
          profileName: dev/python/mypy
        - specDirPath: ./python/ruff
          profileName: dev/python/ruff
        - specDirPath: ./infra/terraform
          profileName: dev/infra/terraform
        - specDirPath: ./infra/kubectl
          profileName: dev/infra/kubectl
        - specDirPath: ./infra/kubectx
          profileName: dev/infra/kubectx
        - specDirPath: ./infra/kind
          profileName: dev/infra/kind
        - specDirPath: ./infra/docker
          profileName: dev/infra/docker
        - specDirPath: ./infra/podman
          profileName: dev/infra/podman
        - specDirPath: ./infra/cilium
          profileName: dev/infra/cilium
        - specDirPath: ./golang
          profileName: dev/golang
        - specDirPath: ./ruby
          profileName: dev/ruby
        - specDirPath: ./js/nvm
          profileName: dev/js/nvm
        - specDirPath: ./js/pnpm
          profileName: dev/js/pnpm
        - specDirPath: ./js/prettier
          profileName: dev/js/prettier
        - specDirPath: ./terminal/tmux
          profileName: dev/terminal/tmux
        - specDirPath: ./editors/vim
          profileName: dev/editors/vim

##[<] 🤖🤖
