# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  'dev/terminal/kitty':
    type: host
    include:
      makeLinks:
        - source: _home/**
          dest: $HOME/**
      installPackages:
        - kitty

  'dev/terminal/kitty/terminfo':
    type: host
    options:
      runIf:
        - builtin:isOs == linux
    include:
      installPackages:
        - kitty-terminfo
        - ncurses-term

##[<] 🤖🤖
