# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

dev/terminal/kitty:
  include:
    makeLinks:
      - source: _home/**
        dest: $HOME/**
    installPackages:
      - kitty

dev/terminal/kitty/terminfo:
  options:
    runIf:
      - builtin:isOs == linux
  include:
    installPackages:
      - kitty-terminfo
      - ncurses-term
##[<] 🤖🤖
