unbind-key -q -T root -a
unbind-key -q -T prefix -a
unbind-key -q -T copy-mode -a
unbind-key -q -T copy-mode-vi -a

##[>] 🤖🤖
#[why] EDITOR=vim flips mode-keys to vi, whose table is emptied above: pin emacs so the copy-mode bindings below are the ones in effect
set -g mode-keys emacs
set -g mouse on
#[why] OSC 52: copy-selection lands in the system clipboard through the terminal, not only tmux's buffer
set -g set-clipboard on
bind-key -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind-key -T root MouseDown1Status select-window -t =
bind-key -T root MouseDrag1Border resize-pane -M
bind-key -T root WheelUpPane if-shell -F -t = "#{||:#{mouse_any_flag},#{pane_in_mode}}" "send-keys -M" "copy-mode -e"
bind-key -T root WheelDownPane send-keys -M
#[why] drag over text at the prompt: enter copy-mode selecting (-M), unless the app grabs the mouse; release copies (copy-mode MouseDragEnd1Pane) and exits
bind-key -T root MouseDrag1Pane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -eM"
bind-key -T copy-mode WheelUpPane send-keys -X -N 3 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 3 scroll-down
bind-key -T copy-mode MouseDrag1Pane send-keys -X begin-selection
#[why] copy-selection, not copy-selection-and-cancel: cancel snaps the view to the bottom, losing the scrollback position
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T root MouseDown3Pane display-menu -t = -x M -y M \
    "new pane"     t  { split-window -v -c "#{pane_current_path}"; select-layout main-vertical } \
    "kill pane"    w  { kill-pane } \
    "zoom pane"    p  { resize-pane -x '85%' -y '85%' } \
    "main layout"  m  { select-layout main-vertical } \
    "" \
    "scroll"       s  { copy-mode -e } \
    "new window"   c  { new-window -c "#{pane_current_path}" } \
    "kill window"  W  { confirm-before -p "kill window #W? (y/n)" kill-window }
##[<] 🤖🤖

set -g status on
set -g status-interval 1
set -g status-position top

set -g status-right "#(date '+%a %d %b, %-l %p %Z ')"
set -g status-right-length 40
set -g status-style "bg=#b8b8b8,fg=#2a2a2a"

set -g status-left "#[fg=#555555]#S #[fg=#888888]│ "
set -g status-left-length 40

setw -g window-status-style "bg=#b8b8b8,fg=#2a2a2a"
setw -g window-status-format "#W"
setw -g window-status-current-style "bg=#b8b8b8,fg=#000000,bold"
setw -g window-status-current-format "#[fg=#000000,bold]#W#[default]"
setw -g window-status-current-format "#[bold]#W#[nobold]"
setw -g window-status-separator " | "

set -g status-left-style "bg=#b8b8b8,fg=#2a2a2a"
set -g status-right-style "bg=#b8b8b8,fg=#2a2a2a"

set -g pane-border-style "fg=#888888" 
set -g pane-active-border-style "fg=#1a1a1a,bold" 
set -g pane-border-status bottom
##[>] 🤖🤖
set -g pane-border-format "#{?pane_active,#[fg=#000000#],#[fg=#707070]} #(/usr/local/scripts/shell/tmux-pane-shortpwd.zsh '#{pane_current_path}' git)#[align=right]#{?pane_active,#[fg=#000000#],#[fg=#707070]}#(/usr/local/scripts/shell/tmux-pane-shortpwd.zsh '#{pane_current_path}' pwd) "
##[<] 🤖🤖

set -g message-style "bg=#b8b8b8,fg=#000000,bold"


#[what] cmd + t - new pane
bind-key -T prefix t \
    split-window -v -c "#{pane_current_path}" \; \
    select-layout main-vertical

#[what] cmd + w - close pane
bind-key -T prefix w kill-pane

#[what] cmd + alt + arrows - navigation
bind-key -T prefix Right select-pane -R
bind-key -T prefix Left  select-pane -L
bind-key -T prefix Down  select-pane -D
bind-key -T prefix Up    select-pane -U

#[what] zoom pane - cmd + alt + =
bind-key -T prefix p resize-pane -x '85%' -y '85%'

#[what] zoom out pane - cmd + alt + -
bind-key -T prefix m select-layout main-vertical
