# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
profilesDefinitions:
  'shell/base/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
    include:
      profiles:
        - specDirPath: ./zsh/base
          profileName: shell/zsh/base-macos
        - specDirPath: ./zsh/extras
          profileName: shell/zsh/extras
        - specDirPath: ./man
          profileName: shell/man
        - specDirPath: ./rg
          profileName: shell/rg
        - specDirPath: ./curl
          profileName: shell/curl

  'shell/host/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
        - builtin:isVirt == false
    include:
      profiles:
        - shell/base/macos

  'shell/virt/linux':
    type: host
    options:
      runIf:
        - builtin:isOs == linux
    include:
      profiles:
        - specDirPath: ./zsh/base
          profileName: shell/zsh/base-linux
        - specDirPath: ./zsh/extras
          profileName: shell/zsh/extras
        - specDirPath: ./man
          profileName: shell/man
        - specDirPath: ./rg
          profileName: shell/rg
        - specDirPath: ./curl
          profileName: shell/curl

##[<] 🤖🤖