# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

aws:
  include:
    runScripts:
      - scripts/01-install-aws-cli.zsh

#[why] op:// template, real host only: virt (cli/macos vm, sandbox pod) has no op and no use for aws config
aws/configs:
  options: {runIf: ['builtin:isVirt == false']}
  include:
    renderTemplates:
      - templates: [{source: _home/**, dest: $HOME/**}]
##[<] 🤖🤖
