providers:
  claude-code:
    script: llm-run-claude-code.zsh
    model: sonnet
    env:
      CLAUDE_CODE_DISABLE_THINKING: "1"
      CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING: "1"
      MAX_THINKING_TOKENS: "0"
  ollama:
    script: llm-run-ollama.zsh
    model: gemma4:e4b-mlx
    think: false
    options:
      temperature: 0
      num_ctx: 16384
    env: {}

scripts:
  llm-git-branch-name-suggest.zsh:
    provider:
      id: claude-code
      config: {}
    template: git-branch-name-suggest.md.tpl
    env: {}
  llm-git-commit-suggest.zsh:
    provider:
      id: claude-code
      config: {}
    template: git-commit-msg-suggest.md.tpl
    env: {}
  llm-git-mr-suggest.zsh:
    provider:
      id: claude-code
      config: {}
    template: git-mr-text-suggest.md.tpl
    env: {}
