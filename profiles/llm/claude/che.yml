# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

llm/claude:
  include:
    makeLinks:
      - source: _home/**
        dest: $HOME/**
    makeDirs:
      - directories:
          - dest:
              - $HOME/.config/claude/rules/code/go
              - $HOME/.config/claude/rules/code/python
              - $HOME/.config/claude/rules/code/ruby
              - $HOME/.config/claude/rules/code/zsh
              - $HOME/.config/claude/rules/config/zsh
              - $HOME/.config/claude/output-styles
              - $HOME/.config/claude/skills/user-decipher-code
              - $HOME/.config/claude/skills/user-git-ops
              - $HOME/.config/claude/skills/user-humanize-prose
              - $HOME/.config/claude/skills/user-junior-wrote-this-code-refactor-redesign
              - $HOME/.config/claude/skills/user-prettify-code
    renderTemplates:
      - source: _home/**
        dest: $HOME/**
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //repos/configs/ai/claude-skills
            dest: $HOME/.config/claude/skills
            <<<:
              - source: /user-git-ops/SKILL.md
                dest: user-git-ops/SKILL.md
              - source: /user-prettify-code/SKILL.md
                dest: user-prettify-code/SKILL.md
              - source: /user-humanize-prose/SKILL.md
                dest: user-humanize-prose/SKILL.md
              - source: /user-decipher-code/SKILL.md
                dest: user-decipher-code/SKILL.md
              - source: /user-junior-wrote-this-code-refactor-redesign/SKILL.md
                dest: user-junior-wrote-this-code-refactor-redesign/SKILL.md
              - source: /user-handoff/SKILL.md
                dest: user-handoff/SKILL.md
          - source: //repos/configs/ai/claude-rules
            dest: $HOME/.config/claude/rules
            <<<:
              - source: /code/go/principles.md
                dest: code/go/principles.md
              - source: /code/python/principles.md
                dest: code/python/principles.md
              - source: /code/python/python.md
                dest: code/python/python.md
              - source: /code/python/scripts.md
                dest: code/python/scripts.md
              - source: /code/ruby/principles.md
                dest: code/ruby/principles.md
              - source: /code/zsh/zsh.md
                dest: code/zsh/zsh.md
              - source: /config/claudecode.md
                dest: config/claudecode.md
              - source: /config/git.md
                dest: config/git.md
              - source: /config/ssh.md
                dest: config/ssh.md
              - source: /config/vscode.md
                dest: config/vscode.md
              - source: /config/zsh/functions.md
                dest: config/zsh/functions.md
              - source: /config/zsh/zsh.md
                dest: config/zsh/zsh.md
          - source: //repos/configs/ai/claude-output-styles/interactive-code.md
            dest: $HOME/.config/claude/output-styles/interactive-code.md
    installPackages:
      - claude

llm/claude/virt:
  options:
    profileWorkingDirectory: .
  include:
    renderTemplates:
      - dest: ${invokingSpecGitRoot}/.claude
        ctx:
          repo: Configs
        <<<:
          #[why] straight from prose, the snippets' only home: rendering them into this repo first
          #   would put a second copy of prose content under version control here
          - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}//repos/configs/ai/claude-snippets"
            dest: agents
            options:
              skipAutoGeneratedHeader: true
            <<<:
              - source: /ro.md
                dest: ro.md
              - source: /rw.md
                dest: rw.md
          - source: templates/snippets
            options:
              skipAutoGeneratedHeader: true
            <<<:
              - source: settings.json
                dest: settings.json
              - source: claude-gitignore
                dest: .gitignore
##[<] 🤖🤖
