# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

llm/claude:
  include:
    makeLinks:
      - {source: _home/**, dest: $HOME/**}
    renderTemplates:
      - {source: _home/**, dest: $HOME/**}
    installPackages:
      - claude

llm/claude/virt:
  options: {profileWorkingDirectory: .}
  include:
    renderTemplates:
      - ctx: {repo: Configs}
        <<<:
          #[why] straight from prose, the snippets' only home: rendering them into this repo first
          #   would put a second copy of prose content under version control here
          - source: "@gitlab.com/konradodwrot/prose?ref=v0.0.4"
            <<<:
              - {source: //repos/configs/ai/claude-snippets/ro.md, dest: [{path: "${invokingSpecGitRoot}/.claude/agents/ro.md", options: {skipAutoGeneratedHeader: true}}]}
              - {source: //repos/configs/ai/claude-snippets/rw.md, dest: [{path: "${invokingSpecGitRoot}/.claude/agents/rw.md", options: {skipAutoGeneratedHeader: true}}]}
          - {source: templates/snippets/settings.json, dest: [{path: "${invokingSpecGitRoot}/.claude/settings.json", options: {skipAutoGeneratedHeader: true}}]}
          - {source: templates/snippets/claude-gitignore, dest: ["${invokingSpecGitRoot}/.claude/.gitignore"]}
##[<] 🤖🤖
