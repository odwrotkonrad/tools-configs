# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

#[why] ~/.ssh/allowed_signers is deliberately untracked: it is per-host key state
#      that fn-ssh-publish-keys writes on every rotation, not configuration
misc/ssh:
  include:
    makeLinks:
      - source: _home/**
        dest: $HOME/**
      - etc/**
      - usr/**
    installPackages:
      - openssh

#[why] sandbox keypair from 1password, rendered under the standard names the ssh/git config reference; virt only (desktop skips via runIf: never clobber the host's real keys)
misc/ssh/virt:
  options:
    runIf:
      - builtin:isVirt
    profileWorkingDirectory: root-virt
  include:
    renderTemplates:
      - source: _home/.ssh
        chmod: "0600"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: id_access.ontoHost.tpl
            dest: ~/.ssh/id_access
          - source: id_signing.ontoHost.tpl
            dest: ~/.ssh/id_signing
      - source: _home/.ssh
        chmod: "0644"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: id_access.pub.ontoHost.tpl
            dest: ~/.ssh/id_access.pub
          - source: id_signing.pub.ontoHost.tpl
            dest: ~/.ssh/id_signing.pub
##[<] 🤖🤖
