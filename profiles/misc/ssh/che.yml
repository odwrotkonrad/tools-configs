# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

#[why] ~/.ssh/allowed_signers is deliberately untracked: it is per-host key state
#      that fn-ssh-publish-keys writes on every rotation, not configuration
misc/ssh:
  include:
    makeLinks:
      - source: _home/**
        dest: $HOME/**
      - etc/**
      - usr/**
    installPackages:
      - openssh

#[why] sandbox keypair from 1password, rendered under the standard names the ssh/git config reference; virt only (desktop skips via runIf: never clobber the host's real keys)
misc/ssh/virt:
  options:
    runIf:
      - builtin:isVirt
    profileWorkingDirectory: root-virt
  include:
    renderTemplates:
      - chmod: "0600"
        <<<:
          - source: _home/.ssh/id_access.ontoHost.tpl
            dest:
              - path: ~/.ssh/id_access
                options:
                  skipAutoGeneratedHeader: true
          - source: _home/.ssh/id_signing.ontoHost.tpl
            dest:
              - path: ~/.ssh/id_signing
                options:
                  skipAutoGeneratedHeader: true
      - chmod: "0644"
        <<<:
          - source: _home/.ssh/id_access.pub.ontoHost.tpl
            dest:
              - path: ~/.ssh/id_access.pub
                options:
                  skipAutoGeneratedHeader: true
          - source: _home/.ssh/id_signing.pub.ontoHost.tpl
            dest:
              - path: ~/.ssh/id_signing.pub
                options:
                  skipAutoGeneratedHeader: true
##[<] 🤖🤖
