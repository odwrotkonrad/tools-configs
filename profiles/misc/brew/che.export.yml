# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  'misc/brew':
    type: host
    include:
      makeLinks:
        - etc/**
      makeDirs:
        - directories:
            - dest:
                - $HOME/.cache/homebrew
            - dest:
                - $HOME/.local/state/homebrew

  'misc/brew/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
    include:
      makeLinks:
        - source: _home/**
          dest: $HOME/**

##[<] 🤖🤖
