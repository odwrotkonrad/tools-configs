options:
  profileWorkingDirectory: root

misc/brew:
  include:
    makeLinks:
      - etc/**

misc/brew/macos:
  options: {runIf: ['builtin:isOs == macos']}
  include:
    makeLinks:
      - {source: _home/**, dest: $HOME/**}
