# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

misc/macos:
  options: {runIf: ['builtin:isOs == macos']}
  include:
    makeLinks:
      - etc/**
      - usr/**

misc/macos/desktop:
  options: {runIf: ['builtin:isOs == macos', 'builtin:isVirt == false']}
  include:
    renderTemplates:
      - templates: [{source: _home/**, dest: $HOME/**}]
    runScripts:
      - scripts/01-install-go-host-tools.zsh
##[<] 🤖🤖
