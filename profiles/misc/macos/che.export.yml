# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

misc/macos:
  options:
    runIf:
      - builtin:isOs == macos
  include:
    makeLinks:
      - etc/**
      - usr/**
    installPackages:
      - duti

misc/macos/desktop:
  options:
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt == false
  include:
    renderTemplates:
      - source: _home/**
        dest: $HOME/**
    installPackages:
      - get-os-open-files-with
      - beekeeper-studio
##[<] 🤖🤖
