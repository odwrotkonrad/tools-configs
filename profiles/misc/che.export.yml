# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
profilesDefinitions:
  'misc/base/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
    include:
      profiles:
        - specDirPath: ./che
          profileName: misc/che
        - specDirPath: ./brew
          profileNames:
            - misc/brew
            - misc/brew/macos
        - specDirPath: ./macos
          profileName: misc/macos
        - specDirPath: ./ssh
          profileNames:
            - misc/ssh
            - misc/ssh/virt

  'misc/host/macos':
    type: host
    options:
      runIf:
        - builtin:isOs == macos
        - builtin:isVirt == false
    include:
      profiles:
        - misc/base/macos
        - specDirPath: ./macos
          profileName: misc/macos/desktop
        - specDirPath: ./onepassword
          profileName: misc/onepassword

  'misc/virt/linux':
    type: host
    options:
      runIf:
        - builtin:isOs == linux
    include:
      profiles:
        - specDirPath: ./che
          profileName: misc/che
        - specDirPath: ./ssh
          profileNames:
            - misc/ssh
            - misc/ssh/virt

##[<] 🤖🤖
