options:
  profileWorkingDirectory: root

misc/che:
  include:
    makeLinks:
      - source: _home/**
        dest: $HOME/**
    makeDirs:
      - directories:
          - dest:
              - $HOME/.local/state/che/backups
    installPackages:
      - che
