---
title: Tools Inventory
description: Inventory of tools and their config files.
references:
  assets/data/tools-inventory-index.yml: Primary config file per tool.
---

#[what] Shared files referenced by many tools.
files:
  profiles/shell/zsh/base/root-linux/etc/zsh/:
    zshenv:
    zshrc:
  profiles/shell/zsh/base/root/etc/zsh/zshrc.d/auto.d/00-base/30-aliases.zsh:
  profiles/shell/zsh/extras/root/:
    _home/.config/zsh/zshenv.d/auto.d/extras/20-tools-env.zsh:
    etc/zsh/:
      zshenv.d/auto.d/extras/20-tools-env.zsh:
      zshrc.d/auto.d/extras/20-tools-aliases.zsh:
      zshrc.d/static-history.d/50-tools:

#>[what] Tool specific files
tools:



  - defaults:
      files:
        profiles/misc/macos/:
          che.yml:
          root/etc/defaults.yml:
          root/usr/local/scripts/shell/load-defaults-config.zsh:
          root/_home/Library/LaunchAgents/load-defaults-config.plist.ontoHost.tpl:

  - docker:
      files:
        profiles/dev/infra/docker/:
          che.yml:

  - editorconfig:
      files:
        profiles/dev/misc/editorconfig/root/_home/.editorconfig:

  - gcp:
      files:
        profiles/cloud/gcp/:
          che.yml:
          scripts/10-check-auth.zsh:
          root/_home/.config/gcloud/configurations/:
            config_main.ontoHost.tpl:
            config_staging.ontoHost.tpl:
            config_production.ontoHost.tpl:
          root/_home/.config/zsh/zshenv.d/auto.d/gcp/20-env.zsh:
          root/etc/zsh/zshenv.d/auto.d/gcp/30-adc.zsh:

  - git:
      files:
        profiles/git/che.yml:
        profiles/git/root/usr/local/scripts/shell/conventional-prefix.sh:
        profiles/git/root/_home/.config/git/:
          config:
          ignore:
          commit-template:
        profiles/misc/ssh/root/etc/zsh/zshenv.d/functions/fn-ssh-test-git-connection:

  - gitlab-runner:
      files:
        profiles/gitlab/runner/:
          che.yml:
          scripts/01-boot-service.zsh:
          root/_home/.gitlab-runner/config.toml.ontoHost.tpl:
          root/Library/LaunchAgents/gitlab-runner.plist.ontoHost.tpl:

  - glab:
      files:
        profiles/gitlab/glab/:
          che.yml:
          root/etc/zsh/:
            zshenv.d/auto.d/gitlab/10-params-secrets.zsh:
            zshrc.d/auto.d/gitlab/10-auth.zsh:

  - golang:
      files:
        profiles/dev/golang/:
          che.yml:

  - homebrew:

  - jaeger:
      files:
        profiles/observability/jaeger/:
          che.yml:
          scripts/01-boot-service.zsh:
          root/etc/jaeger/config.yml:
          root/Library/LaunchDaemons/jaeger.plist.ontoHost.cp:

  - kind:
      files:
        profiles/dev/infra/kind/:
          che.yml:

  - kitty:
      files:
        profiles/dev/terminal/kitty/:
          che.yml:
          root/_home/.config/kitty/:
            kitty.conf:
            dark-theme.auto.conf:
            light-theme.auto.conf:
            no-preference-theme.auto.conf:

  - kubectl:
      files:
        profiles/dev/infra/kubectl/:
          che.yml:

  - kubectx:
      files:
        profiles/dev/infra/kubectx/:
          che.yml:

  - man:
      files:
        profiles/shell/man/root/etc/man.conf:

  - nvm:
      files:
        profiles/dev/js/nvm/root/_home/.nvmrc:

  - onepassword:
      files:
        profiles/misc/onepassword/:
          che.yml:
          scripts/02-init-auth.zsh:
          root/etc/zsh/zshenv.d/auto.d/onepassword/10-token.zsh:

  - pnpm:
      files:
        profiles/dev/js/pnpm/:
          che.yml:

  - prettier:
      files:
        profiles/dev/js/prettier/root/_home/.config/prettier/.prettierrc.yml:

  - prometheus:
      files:
        profiles/observability/prometheus/:
          che.yml:
          scripts/01-boot-service.zsh:
          root/etc/prometheus/prometheus.yml:
          root/Library/LaunchDaemons/prometheus.plist.ontoHost.cp:

  - pyenv:

  - ruby:
      files:
        profiles/dev/ruby/:
          che.yml:

  - rg:
      files:
        profiles/shell/rg/root/etc/rg/:
          rgrc:
          rgignore:
        profiles/shell/zsh/base/root/etc/zsh/zshrc.d/functions/fn-load-static-history:

  - ruff:
      files:
        profiles/dev/python/ruff/root/_home/.config/ruff/ruff.toml:

  - ssh:
      files:
        profiles/misc/ssh/che.yml:
        profiles/misc/ssh/root/_home/.ssh/config:
        profiles/misc/ssh/root-virt/_home/.ssh/:
          id_access.ontoHost.tpl:
          id_access.pub.ontoHost.tpl:
          id_signing.ontoHost.tpl:
          id_signing.pub.ontoHost.tpl:
        profiles/misc/ssh/root/etc/zsh/zshenv.d/functions/:
          fn-ssh-generate-keys:
          fn-ssh-test-git-connection:

  - terraform:
      files:
        profiles/dev/infra/terraform/:
          che.yml:

  - tmux:
      files:
        profiles/dev/terminal/tmux/root/_home/.config/tmux/tmux.conf:

  - vim:
      files:
        profiles/dev/editors/vim/root/_home/.config/vim/vimrc:

  - vscode:
      files:
        profiles/dev/editors/vscode/mac/:
          che.yml:
          root/_home/Library/Application Support/Code/User/:
            settings.json.ontoHost.tpl:
            keybindings.json:

  - zsh:
      files:
        profiles/shell/zsh/:
          base/che.yml:
          base/root/_home/.config/zsh/:
            .zshenv:
            .zprofile:
            .zshrc:
            .zlogin:
            .zlogout:
            zshrc.d/auto.d/00-base/20-dirs.zsh:
          base/root/etc/zsh/:
            zshenv.d/:
            zshrc.d/:
          base/root-linux/etc/zsh/:
            zshenv:
            zprofile:
            zshrc:
            zlogin:
            zlogout:
          base/root-macos/etc/:
          extras/che.yml:
          extras/root/:
