---
title: Tools Inventory
description: Inventory of tools and their config files.
references:
  assets/data/tools-inventory-index.yml: Primary config file per tool.
---

#[what] Shared files referenced by many tools.
files:
  tools/zsh/base/root-linux/etc/zsh/:
    zshenv:
    zshrc:
  tools/zsh/base/root/etc/zsh/zshrc.d/auto.d/00-base/30-aliases.zsh:
  tools/zsh/extras/root/:
    _home/.config/zsh/zshenv.d/auto.d/extras/20-tools-env.zsh:
    etc/zsh/:
      zshenv.d/auto.d/extras/20-tools-env.zsh:
      zshrc.d/auto.d/extras/20-tools-aliases.zsh:
      zshrc.d/static-history.d/50-tools:

#>[what] Tool specific files
tools:
  - asdf:
      files:
        root/_home/:
          .config/asdf/.asdfrc:
          .tool-versions:
        root/etc/zsh/functions/fn_asdf_install:

  - ccstatusline:
      files:
        root/_home/.config/ccstatusline/settings.json:

  - claude:
      files:
        root/_home/.config/claude/:
          CLAUDE.md:
          settings.json:
          agents/:
          rules/:
          skills/:
          plugins/:
            known_marketplaces.json:
            installed_plugins.json:

  - codex:
      files:
        root/_home/.config/codex/config.toml.ontoHost.tpl:

  - defaults:
      files:
        root/:
          etc/defaults.yml:
          usr/local/scripts/shell/load-defaults-config.zsh:
          Users/ko/Library/LaunchAgents/load-defaults-config.plist:

  - editorconfig:
      files:
        root/_home/.editorconfig:

  - git:
      files:
        tools/git/che.yml:
        tools/git/scripts/01-install-git.zsh:
        tools/git/root/_home/.config/git/:
          config:
          ignore:
          commit-template:
        tools/ssh/root/etc/zsh/zshenv.d/functions/fn-ssh-test-git-connection:

  - gitlab-projects:
      files:
        tools/gitlab/projects/:
          che.yml:
          scripts/:
            10-clone.zsh:
            20-index.zsh:
          templates/subgroup-index.md.ontoRepo.tpl:
          tree/:

  - gitlab-runner:
      files:
        tools/gitlab/runner/:
          che.yml:
          scripts/01-install-gitlab-runner.zsh:
          root/_home/.gitlab-runner/config.toml.ontoHost.tpl:
          root/Library/LaunchAgents/gitlab-runner.plist.ontoHost.tpl:

  - glab:
      files:
        tools/gitlab/glab/:
          che.yml:
          scripts/01-install-glab.zsh:
          root/_home/.config/glab-cli/config.yml.ontoHost.cp:
          root/etc/zsh/:
            zshenv.d/auto.d/gitlab/10-params-secrets.zsh:
            zshrc.d/auto.d/gitlab/10-auth.zsh:

  - golang:

  - homebrew:

  - jaeger:
      files:
        root/etc/jaeger/config.yml:
        ci/zsh/scripts/installs/92-jaeger.zsh:
        root/Library/LaunchDaemons/jaeger.plist.ontoHost.cp:

  - kitty:
      files:
        root/_home/.config/kitty/:
          kitty.conf:
          dark-theme.auto.conf:
          light-theme.auto.conf:
          no-preference-theme.auto.conf:

  - man:
      files:
        root/etc/man.conf:

  - nvm:
      files:
        root/_home/.nvmrc:

  - prettier:
      files:
        root/_home/.config/prettier/.prettierrc.yml:

  - prometheus:
      files:
        root/etc/prometheus/prometheus.yml:
        ci/zsh/scripts/installs/93-prometheus.zsh:
        root/Library/LaunchDaemons/prometheus.plist.ontoHost.cp:

  - pyenv:

  - rg:
      files:
        root/etc/rg/:
          rgrc:
          rgignore:
        tools/zsh/base/root/etc/zsh/zshrc.d/functions/fn-load-static-history:

  - ruff:
      files:
        root/_home/.config/ruff/ruff.toml:

  - ssh:
      files:
        tools/ssh/che.yml:
        tools/ssh/root/_home/.ssh/config:
        tools/ssh/root-virt/_home/.ssh/:
          id_access.ontoHost.tpl:
          id_access.pub.ontoHost.tpl:
          id_signing.ontoHost.tpl:
          id_signing.pub.ontoHost.tpl:
        tools/ssh/root/etc/zsh/zshenv.d/functions/:
          fn-ssh-generate-keys:
          fn-ssh-test-git-connection:

  - tmux:
      files:
        root/_home/.config/tmux/tmux.conf:

  - vim:
      files:
        root/_home/.config/vim/vimrc:

  - vscode:
      files:
        root/_home/Library/Application Support/Code/User/settings.json.ontoHost.tpl:

  - zsh:
      files:
        tools/zsh/:
          base/che.yml:
          base/scripts/:
            01-install-zsh.sh:
            02-install-rg.zsh:
            03-install-brew.zsh:
          base/root/_home/.config/zsh/:
            .zshenv:
            .zprofile:
            .zshrc:
            .zlogin:
            .zlogout:
            zshrc.d/auto.d/00-base/20-dirs.zsh:
          base/root/etc/zsh/:
            zshenv.d/:
            zshrc.d/:
          base/root-linux/etc/zsh/:
            zshenv:
            zprofile:
            zshrc:
            zlogin:
            zlogout:
          base/root-macos/etc/:
          extras/che.yml:
          extras/root/:
