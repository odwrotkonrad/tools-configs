---
title: Tools Inventory
description: Inventory of tools and their config files.
references:
  assets/data/tools-inventory-index.yml: Primary config file per tool.
---

#[what] Shared files referenced by many tools.
files:
  root/HOME/.config/zsh/rc.d/10-tools.zsh:
  root/etc/:
    zshenv:
    zshrc:
    zsh/rc.d/20-tools.zsh:
    zsh/rc.d/40-aliases.zsh:
    zsh/static-history:

#>[what] Tool specific files
tools:
  - asdf:
      files:
        root/HOME/:
          .config/asdf/.asdfrc:
          .tool-versions:
        root/etc/zsh/functions/fn_asdf_install:

  - ccstatusline:
      files:
        root/HOME/.config/ccstatusline/settings.json:

  - claude:
      files:
        root/HOME/.config/claude/:
          CLAUDE.md:
          settings.json:
          agents/:
          rules/:
          skills/:
          plugins/:
            known_marketplaces.json:
            installed_plugins.json:

  - codex:
      files:
        root/HOME/.config/codex/config.toml.host.auto.tmpl:

  - defaults:
      files:
        root/:
          etc/defaults.yml:
          usr/local/scripts/shell/s-root-load-defaults-config:
          Users/ko/Library/LaunchAgents/d-user-load-defaults-config.plist:

  - editorconfig:
      files:
        root/HOME/.editorconfig:

  - fzf:

  - git:
      files:
        root/HOME/.config/git/:
          config:
          ignore:
          commit-template:
        root/etc/zsh/functions/fn-root-ssh-test-git-connection:

  - golang:

  - homebrew:

  - jaeger:
      files:
        root/etc/jaeger/config.yml:
        ci/zsh/scripts/installs/mac/jaeger:
        root/Library/LaunchDaemons/d-root-jaeger.plist.host.auto.cp:

  - kitty:
      files:
        root/HOME/.config/kitty/:
          kitty.conf:
          dark-theme.auto.conf:
          light-theme.auto.conf:
          no-preference-theme.auto.conf:

  - man:
      files:
        root/etc/man.conf:

  - nvm:
      files:
        root/HOME/.nvmrc:

  - prettier:
      files:
        root/HOME/.config/prettier/.prettierrc.yml:

  - prometheus:
      files:
        root/etc/prometheus/prometheus.yml:
        ci/zsh/scripts/installs/mac/prometheus:
        root/Library/LaunchDaemons/d-root-prometheus.plist.host.auto.cp:

  - pyenv:

  - rg:
      files:
        root/etc/rg/:
          rgrc:
          rgignore:
        root/etc/zsh/functions/fn-root-load-static-history:

  - ruff:
      files:
        root/HOME/.config/ruff/ruff.toml:

  - ssh:
      files:
        root/HOME/.ssh/config:
        root/etc/zsh/functions/:
          fn-root-ssh-generate-keys:
          fn-root-ssh-test-git-connection:

  - tmux:
      files:
        root/HOME/.config/tmux/tmux.conf:

  - vim:
      files:
        root/HOME/.config/vim/vimrc:

  - vscode:
      files:
        root/HOME/Library/Application Support/Code/User/settings.json.host.auto.tmpl:

  - zsh:
      files:
        root/HOME/.config/zsh/:
          .zshenv:
          .zprofile:
          .zshrc:
          .zlogin:
          .zlogout:
          rc.d/00-dirs.zsh:
        root/etc/:
          zprofile:
          zlogin:
          zlogout:
          zsh/rc.d/10-shell.zsh:
          zsh/rc.d/50-keybindings.zsh:
          zsh/functions/rm:
