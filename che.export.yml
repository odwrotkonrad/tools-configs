# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
#[why] the package set alone, no makeDirs/runScripts: those bind to a configs checkout ($PWD/ci,
#   ci/zsh/scripts/installs), which an image build composing profiles from a remote ref has not got.
#   split out so such a build can pull the base packages without the checkout-bound ops
base/packages:
  options:
    autoDiscover: false
  include:
    installPackages:
      - bat
      - bats
      - che
      - copilot
      - corepack
      - fd
      - ffmpeg
      - gcc
      - htop
      - jq
      - lefthook
      - libtool
      - make
      - nmap
      - openssl
      - pandoc
      - pcre2
      - pkgconf
      - procs
      - pstree
      - readline
      - shellcheck
      - showkey
      - sqlite3
      - stow
      - tcl
      - tree
      - unzip
      - watch
      - xz
      - yq
      - zlib
      - zstd

base:
  options:
    autoDiscover: false
  include:
    profiles:
      - base/packages
    makeDirs:
      - chmod: "0755"
        directories:
          - dest:
              - $PWD/ci
          - dest:
              - $PWD/ci/zsh
          - dest:
              - $PWD/ci/zsh/functions
    runScripts:
      - ci/zsh/scripts/installs/*.zsh

desktop/macos:
  options:
    autoDiscover: true
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt == false
  include:
    profiles:
      - base
      - source: "profiles/shell"
        profile: shell/host/macos
      - source: "profiles/misc"
        profile: misc/host/macos
      - source: "profiles/git"
        profile: git/host/macos
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ var.AI_TOOLS_CONFIGS_REF }}"
        profile: ai/host/macos
      - source: "profiles/dev"
        profile: dev/host/macos
      - source: "profiles/cloud"
        profile: cloud/host/macos
      - source: "profiles/gitlab"
        profile: gitlab/host/macos
      - source: "profiles/observability"
        profile: observability/host/macos

cli/macos:
  options:
    autoDiscover: true
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt
  include:
    profiles:
      - base
      - source: "profiles/shell"
        profile: shell/base/macos
      - source: "profiles/misc"
        profile: misc/base/macos
      - source: "profiles/git"
        profile: git/base/macos
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ var.AI_TOOLS_CONFIGS_REF }}"
        profile: ai/base/macos
      - source: "profiles/dev"
        profile: dev/base/macos
      - source: "profiles/cloud"
        profile: cloud/base/macos
      - source: "profiles/gitlab"
        profile: gitlab/base/macos
      - source: "profiles/observability"
        profile: observability/base/macos

virt/linux:
  options:
    autoDiscover: true
    runIf:
      - builtin:isOs == linux
  include:
    profiles:
      - base
      - source: "profiles/shell"
        profile: shell/virt/linux
      - source: "profiles/misc"
        profile: misc/virt/linux
      - source: "profiles/git"
        profile: git/virt/linux
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ var.AI_TOOLS_CONFIGS_REF }}"
        profile: ai/virt/linux
      - source: "profiles/dev"
        profile: dev/virt/linux
      - source: "profiles/cloud"
        profile: cloud/virt/linux
      - source: "profiles/gitlab"
        profile: gitlab/virt/linux
      - source: "profiles/observability"
        profile: observability/virt/linux
##[<] 🤖🤖
