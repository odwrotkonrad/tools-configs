stages:
  - validate
  - test

variables:
  PYTHONPATH: root-ln/usr/local/scripts/python
  MYPYPATH: root-ln/usr/local/scripts/python

.base-python:
  needs: []
  image: python:3.14-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make git zsh
    - pip install --no-cache-dir -r root-ln/etc/python/requirements.txt
    - export PATH="$CI_PROJECT_DIR/root-ln/usr/local/scripts/shell:$PATH"

validate-docsgen:
  extends: .base-python
  stage: validate
  script:
    - make run-repo-gen-files
    - git diff --exit-code

validate-typecheck:
  extends: .base-python
  stage: validate
  script:
    - make run-repo-typecheck

test-scripts:
  extends: .base-python
  stage: test
  script:
    - make run-repo-tests
