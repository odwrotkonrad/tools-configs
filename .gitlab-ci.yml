stages:
  - validate
  - test

validate-docsgen:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache tree jq yq
  script:
    - ./root-ln/usr/local/scripts/shell/s-rt-generate-yaml-dir-tree > docs/dirs.yml.new
    - |
      if ! diff -u docs/dirs.yml docs/dirs.yml.new; then
        echo "Run `make` to update autogenerated documentation."
        exit 1
      fi

test-scripts:
  stage: test
  image: python:3.14-slim
  before_script:
    - pip install --no-cache-dir -r root-ln/etc/python/requirements.txt
  script:
    - python -m pytest tests/
