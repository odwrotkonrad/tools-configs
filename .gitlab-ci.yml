workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - validate
  - dry-run-apply
  - smoke-apply

##[>] 🤖🤖
variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest
##[<] 🤖🤖

.base:
  image: $CI_IMAGE
  ##[>] 🤖🤖
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    CC: clang
  cache:
    - key:
        files:
          - ci/zsh/scripts/installs/00-ci-deps.zsh
          - ci/zsh/scripts/installs/80-go-host-tools.zsh
      paths:
        - .cache/go-mod
        - .cache/go-build
  ##[<] 🤖🤖

validate-pre-commit-all:
  extends: .base
  stage: validate
  variables:
    MK_DRY_RUN_RENDER_SECRETS: "true"
  script:
    - make repo-ci-run-precommit-all
    - git diff --exit-code HEAD

dry-run-apply-sync:
  extends: .base
  stage: dry-run-apply
  needs: []
  variables:
    MK_DRY_RUN: all
    CHE_DEBUG: "1"
  parallel:
    matrix:
      - CHE_PROFILE: [desktop/macos, cli/macos, cli/linux]
  script:
    - make sync-install

.e2e-macos:
  #[why] macos remote vms have minimum lease time of 24h, I don't need 24/7 instance running so my local machine polls gitlab pipeline, executes the job and sends results back
  tags: [local]
  image: macos-tahoe-vanilla-base
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/configs

dry-run-apply-macos-desktop:
  extends: .e2e-macos
  stage: dry-run-apply
  variables:
    MK_DRY_RUN: all
    CHE_DEBUG: "1"
    CHE_PROFILE: desktop/macos
  needs: []
  allow_failure: true
  script:
    - make sync-install

apply-macos-cli:
  extends: .e2e-macos
  stage: smoke-apply
  variables:
    CHE_PROFILE: cli/macos
    MK_DRY_RUN_RENDER_SECRETS: "true"
    GITLAB_TOKEN: "" #[why] injected (masked) from gitlab ci/cd settings; overrides this default 🤖
  needs: [dry-run-apply-macos-desktop]
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: manual
  script:
    - make sync-install

apply-linux-cli:
  extends: .base
  stage: smoke-apply
  variables:
    CHE_PROFILE: cli/linux
    MK_DRY_RUN_RENDER_SECRETS: "true"
    GITLAB_TOKEN: "" #[why] injected (masked) from gitlab ci/cd settings; overrides this default 🤖
  needs: []
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: manual
  before_script:
    ##[>] 🤖🤖
    #[why] ci-linux carries no user (ko moved to the dev-sandbox image): create it here for the as-user apply
    - useradd -m -s /bin/zsh -G root ko && echo 'ko ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ko
    - chown -R ko "$CI_PROJECT_DIR"
    ##[<] 🤖🤖
  script:
    ##[>] 🤖🤖
    - sudo -u ko --preserve-env=CI,CHE_PROFILE,MK_DRY_RUN_RENDER_SECRETS,GITLAB_TOKEN,GOMODCACHE,GOCACHE,CC,GOPATH make -C "$CI_PROJECT_DIR" sync-install
    ##[<] 🤖🤖
