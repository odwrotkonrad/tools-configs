workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  auto_cancel:
    on_new_commit: interruptible

stages:
  - validate
  - dry-run-apply
  - test

.base:
  needs: []
  image: python:3.14-slim
  ##[>] 🤖🤖
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    key:
      files:
        - ci/go/go.sum
    paths:
      - .cache/go-mod
      - .cache/go-build
  ##[<] 🤖🤖
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make git zsh curl ca-certificates clang sudo
    - pip install --no-cache-dir -r root/etc/python/requirements.txt
    ##[>] 🤖
    #[why] go toolchain + gomplate, yq, lefthook installed by run-repo-ci-install-deps (00-ci-deps.zsh)
    - export PATH=/usr/local/go/bin:$PATH
    - export CC=clang
    ##[<] 🤖

validate-docsgen:
  extends: .base
  stage: validate
  script:
    - make run-repo-ci-render-templates RENDER_LOCAL=
    - git diff --exit-code

validate-typecheck:
  extends: .base
  stage: validate
  script:
    - make run-repo-ci-typecheck

dry-run-apply-sync:
  extends: .base
  stage: dry-run-apply
  parallel:
    matrix:
      - CHE_FORCE_PROFILE: [desktop/macos, cli/macos, cli/linux]
  script:
    - MK_DRY_RUN=all make run-sync-full

test-python:
  extends: .base
  stage: test
  script:
    - make run-repo-ci-tests-python

test-go:
  extends: .base
  stage: test
  script:
    - make run-repo-ci-tests-go

.e2e-macos:
  #[why] macos remote vms have minimum lease time of 24h, I don't need 24/7 instance running so my local machine polls gitlab pipeline, executes the job and sends results back
  tags: [local]
  image: macos-tahoe-vanilla-base
  resource_group: macos-local-vm
  interruptible: true  #[what] new commits will cancel this job to free up resource 🤖
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/configs

dry-run-apply-macos-desktop:
  extends: .e2e-macos
  stage: dry-run-apply
  needs: []
  script:
    - MK_DRY_RUN=all make run-sync


apply-macos-desktop:
  extends: .e2e-macos
  stage: test
  needs: [dry-run-apply-macos-desktop]
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
  script:
    - make run-sync
