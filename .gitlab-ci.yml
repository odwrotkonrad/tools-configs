workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - dry-run-apply
  - smoke-apply
  - trigger-image

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. jobs needing arm64 or another size
#   override with their own tags
default:
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64

##[>] 🤖🤖
variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest
##[<] 🤖🤖

.base:
  image: $CI_IMAGE
  ##[>] 🤖🤖
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    CC: clang
    #[why] fresh container: che's config.yml symlink lands during the very run that installs packages,
    #   so the file cannot enable this in time. without it che falls back to the definitions embedded in
    #   the released binary, which lag behind the published che-packages set 🤖🤖
    CHE_PACKAGES_UPDATE_CHECK: "true"
  cache:
    - key:
        files:
          - ci/zsh/scripts/installs/00-ci-deps.zsh
      paths:
        - .cache/go-mod
        - .cache/go-build
  ##[<] 🤖🤖

.as-user:
  extends: .base
  ##[>] 🤖🤖
  variables:
    CI_USER: ko
  before_script:
    #[why] ci-linux carries no user (ko moved to the sandbox image): create it here for the as-user apply
    - useradd -m -s /bin/zsh -G root "$CI_USER" && echo "$CI_USER ALL=(ALL) NOPASSWD:ALL" >"/etc/sudoers.d/$CI_USER"
    - chown -R "$CI_USER" "$CI_PROJECT_DIR"
    #[why] GOPATH is the image's root-owned /usr/local/go-tools: `go install` as ko cannot create pkg/sumdb there, so pre-create the tree and hand it over
    - mkdir -p "$GOPATH/bin" "$GOPATH/pkg" && chown -R "$CI_USER" "$GOPATH"
  ##[<] 🤖🤖

validate-pre-commit-all:
  extends: .base
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    MK_DRY_RUN_RENDER_SECRETS: "true"
  script:
    - make repo-ci-run-precommit-all
    - git diff --exit-code HEAD

dry-run-apply-sync:
  extends: .as-user
  stage: dry-run-apply
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    MK_DRY_RUN: all
    CHE_DEBUG: "1"
  parallel:
    matrix:
      - CHE_PROFILE: [virt/linux]
  script:
    ##[>] 🤖🤖
    - sudo -u "$CI_USER" --preserve-env=CI,CHE_PROFILE,CHE_DEBUG,CHE_VALIDATE_SPEC,CHE_PACKAGES_UPDATE_CHECK,MK_DRY_RUN,MK_DRY_RUN_RENDER_SECRETS,GITLAB_TOKEN,GOMODCACHE,GOCACHE,CC,GOPATH make -C "$CI_PROJECT_DIR" sync-full
    ##[<] 🤖🤖

.e2e-macos:
  ##[>] 🤖🤖
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  variables:
    CHE_DEBUG: "1"
  ##[<] 🤖🤖

dry-run-apply-macos:
  extends: .e2e-macos
  stage: dry-run-apply
  rules:
    - if: $ENABLE_DARWIN_CI != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    MK_DRY_RUN: all
  parallel:
    matrix:
      - CHE_PROFILE: [desktop/macos, cli/macos]
  needs: []
  script:
    - make sync-full

apply-macos-cli:
  extends: .e2e-macos
  stage: smoke-apply
  variables:
    CHE_PROFILE: cli/macos
    MK_DRY_RUN_RENDER_SECRETS: "true"
    GITLAB_TOKEN: "" #[why] injected (masked) from gitlab ci/cd settings; overrides this default 🤖
  needs: [dry-run-apply-macos]
  rules:
    - if: $ENABLE_DARWIN_CI != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
  script:
    - make sync-full

apply-linux-cli:
  extends: .as-user
  stage: smoke-apply
  variables:
    CHE_PROFILE: virt/linux
    MK_DRY_RUN_RENDER_SECRETS: "true"
    GITLAB_TOKEN: "" #[why] injected (masked) from gitlab ci/cd settings; overrides this default 🤖.
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
  script:
    ##[>] 🤖🤖
    - sudo -u "$CI_USER" --preserve-env=CI,CHE_PROFILE,CHE_DEBUG,CHE_VALIDATE_SPEC,CHE_PACKAGES_UPDATE_CHECK,MK_DRY_RUN,MK_DRY_RUN_RENDER_SECRETS,GITLAB_TOKEN,GOMODCACHE,GOCACHE,CC,GOPATH make -C "$CI_PROJECT_DIR" sync-full
    ##[<] 🤖🤖

##[>] 🤖🤖
rebuild-sandbox-image:
  stage: trigger-image
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  inherit:
    variables: false
  variables:
    BUILD_SANDBOX_IMAGE: "true"
  trigger:
    project: konradodwrot/infra/sandbox
    branch: main
    forward:
      yaml_variables: true
      pipeline_variables: false
##[<] 🤖🤖
