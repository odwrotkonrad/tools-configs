stages:
  - validate
  - test

.base-python:
  needs: []
  image: python:3.14-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make git zsh curl ca-certificates
    - pip install --no-cache-dir -r root-ln/etc/python/requirements.txt
    - curl -fsSL https://github.com/hairyhenderson/gomplate/releases/download/v5.1.0/gomplate_linux-amd64 -o /usr/local/bin/gomplate
    - chmod +x /usr/local/bin/gomplate

validate-docsgen:
  extends: .base-python
  stage: validate
  script:
    - make run-repo-render-templates
    - git diff --exit-code

validate-typecheck:
  extends: .base-python
  stage: validate
  script:
    - make run-repo-typecheck

test-scripts:
  extends: .base-python
  stage: test
  script:
    - make run-repo-tests
