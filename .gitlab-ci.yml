workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - validate
  - dry-run-apply
  - test

.base:
  needs: []
  image: debian:bookworm-slim
  ##[>] 🤖🤖
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    CC: clang
  cache:
    key:
      files:
        - ci/go/go.sum
    paths:
      - .cache/go-mod
      - .cache/go-build
  ##[<] 🤖🤖
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make git zsh curl ca-certificates clang sudo

validate-docsgen:
  extends: .base
  stage: validate
  script:
    - make run-repo-ci-render-templates RENDER_LOCAL=
    - git diff --exit-code

dry-run-apply-sync:
  extends: .base
  stage: dry-run-apply
  variables:
    MK_DRY_RUN: all
  parallel:
    matrix:
      - CHE_FORCE_PROFILE: [desktop/macos, cli/macos, cli/linux]
  script:
    - make run-sync-full

test-go:
  extends: .base
  stage: test
  script:
    - make run-repo-ci-tests-go

.e2e-macos:
  #[why] macos remote vms have minimum lease time of 24h, I don't need 24/7 instance running so my local machine polls gitlab pipeline, executes the job and sends results back
  tags: [local]
  image: macos-tahoe-vanilla-base
  resource_group: macos-local-vm
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/configs

dry-run-apply-macos-desktop:
  extends: .e2e-macos
  stage: dry-run-apply
  variables:
    MK_DRY_RUN: all
    CHE_FORCE_PROFILE: desktop/macos
  needs: []
  script:
    - make run-sync-full

apply-macos-cli:
  extends: .e2e-macos
  stage: test
  variables:
    CHE_FORCE_PROFILE: cli/macos
  needs: [dry-run-apply-macos-desktop]
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: manual
  script:
    - make run-sync-full
