workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - validate
  - test

.base-python:
  needs: []
  image: python:3.14-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make git zsh curl ca-certificates
    - pip install --no-cache-dir -r root-ln/etc/python/requirements.txt
    - curl -fsSL https://github.com/hairyhenderson/gomplate/releases/download/v5.1.0/gomplate_linux-amd64 -o /usr/local/bin/gomplate
    - chmod +x /usr/local/bin/gomplate
    - curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /usr/local/bin/yq
    - chmod +x /usr/local/bin/yq

validate-docsgen:
  extends: .base-python
  stage: validate
  script:
    - make run-repo-render-templates RENDER_LOCAL=
    - git diff --exit-code

validate-typecheck:
  extends: .base-python
  stage: validate
  script:
    - make run-repo-typecheck

test-scripts:
  extends: .base-python
  stage: test
  script:
    - make run-repo-tests

test-configs-e2e-macos:
  stage: test
  needs: []
  #[…] 🤖🤖
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
  #[⫶] 🤖🤖
  #[∵] macos remote vms have minimum lease time of 24h, I don't need 24/7 instance running so my local machine polls gitlab pipeline, executes the job and sends results back
  tags: [local]
  image: ko-macos-tahoe-vanilla
  resource_group: local-macos
  interruptible: true  #[≟] newer pipeline auto-cancels this job 🤖🤖
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/configs
  script:
    - make run-host-upsert-configs
    - make run-host-mk-dirs
    - make run-host-install-all
