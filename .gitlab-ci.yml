stages:
  - validate
  - test

validate-docsgen:
  stage: validate
  image: python:3.14-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make tree jq curl git
    - curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
    - pip install --no-cache-dir -r root-ln/etc/python/requirements.txt
  script:
    - ./root-ln/usr/local/scripts/shell/s-rt-generate-yaml-dir-tree > docs/data/dirs.yml.new
    - |
      if ! diff -u docs/data/dirs.yml docs/data/dirs.yml.new; then
        echo "Run `make docs` to update the directory tree."
        exit 1
      fi
    - PYTHONPATH=root-ln/usr/local/scripts/python python3.14 root-ln/usr/local/scripts/python/s-rt-gen-markdown docs/templates/README.tmpl.md > README.md.new
    - |
      if ! diff -u README.md README.md.new; then
        echo "Run `make readme` to update README.md."
        exit 1
      fi

test-scripts:
  stage: test
  image: python:3.14-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends make
    - pip install --no-cache-dir -r root-ln/etc/python/requirements.txt
  script:
    - make test
