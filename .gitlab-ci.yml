workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - validate
  - dry-run-apply
  - smoke-apply

.base:
  needs: []
  image: debian:bookworm-slim
  ##[>] 🤖🤖
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    CC: clang
  cache:
    - key:
        files:
          - ci/zsh/scripts/installs/00-ci-deps.zsh
          - ci/zsh/scripts/installs/80-go-host-tools.zsh
      paths:
        - .cache/go-mod
        - .cache/go-build
    - key: apt-debs-bookworm
      paths:
        - .cache/apt-archives
  ##[<] 🤖🤖
  before_script:
    ##[>] 🤖🤖
    - mkdir -p .cache/apt-archives
    - apt-get update
    - apt-get -o Dir::Cache::archives=$CI_PROJECT_DIR/.cache/apt-archives install -y --no-install-recommends make git zsh curl ca-certificates clang sudo unzip
    ##[<] 🤖🤖

validate-pre-commit-all:
  extends: .base
  stage: validate
  variables:
    MK_RENDER_SKIP: .env
    CLICOLOR: "0"
  script:
    - make run-repo-ci-precommit-all
    - git diff --exit-code HEAD

dry-run-apply-sync:
  extends: .base
  stage: dry-run-apply
  variables:
    MK_DRY_RUN: all
  parallel:
    matrix:
      - CHE_FORCE_PROFILE: [desktop/macos, cli/macos, cli/linux]
  script:
    - make run-sync-full

.e2e-macos:
  #[why] macos remote vms have minimum lease time of 24h, I don't need 24/7 instance running so my local machine polls gitlab pipeline, executes the job and sends results back
  tags: [local]
  image: macos-tahoe-vanilla-base
  resource_group: macos-local-vm
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/configs

dry-run-apply-macos-desktop:
  extends: .e2e-macos
  stage: dry-run-apply
  variables:
    MK_DRY_RUN: all
    CHE_FORCE_PROFILE: desktop/macos
  needs: []
  script:
    - make run-sync-full

apply-macos-cli:
  extends: .e2e-macos
  stage: smoke-apply
  variables:
    CHE_FORCE_PROFILE: cli/macos
    MK_DRY_RUN_RENDER_SECRETS: "true"
  needs: [dry-run-apply-macos-desktop]
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: manual
  script:
    - make run-sync-full

apply-linux-cli:
  extends: .base
  stage: smoke-apply
  variables:
    CHE_FORCE_PROFILE: cli/linux
    MK_DRY_RUN_RENDER_SECRETS: "true"
    GITLAB_TOKEN: "" #[why] injected (masked) from gitlab ci/cd settings; overrides this default 🤖
  needs: []
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: manual
  script:
    - make run-sync-full
