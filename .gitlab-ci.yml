workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - build-image
  - validate
  - dry-run-apply
  - smoke-apply

##[>] 🤖🤖
variables:
  CI_LINUX_IMAGE: $CI_REGISTRY_IMAGE/ci-linux:bookworm

build-ci-linux-image:
  stage: build-image
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - changes:
        - ci/Dockerfile.linux
        - ci/zsh/scripts/installs/00-ci-deps.zsh
        - ci/zsh/functions/fn-*
    - when: manual
      allow_failure: true
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" >/kaniko/.docker/config.json
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/ci/Dockerfile.linux"
        --destination "$CI_LINUX_IMAGE"
        --cache=true
        --cache-repo "$CI_REGISTRY_IMAGE/ci-linux-cache"
##[<] 🤖🤖

.base:
  needs:
    - job: build-ci-linux-image
      optional: true
  image: $CI_LINUX_IMAGE
  ##[>] 🤖🤖
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    CC: clang
  cache:
    - key:
        files:
          - ci/zsh/scripts/installs/00-ci-deps.zsh
          - ci/zsh/scripts/installs/80-go-host-tools.zsh
      paths:
        - .cache/go-mod
        - .cache/go-build
  ##[<] 🤖🤖

validate-pre-commit-all:
  extends: .base
  stage: validate
  variables:
    MK_DRY_RUN_RENDER_SECRETS: "true"
    CLICOLOR: "0"
  script:
    - make run-repo-ci-precommit-all
    - git diff --exit-code HEAD

dry-run-apply-sync:
  extends: .base
  stage: dry-run-apply
  variables:
    MK_DRY_RUN: all
  parallel:
    matrix:
      - CHE_FORCE_PROFILE: [desktop/macos, cli/macos, cli/linux]
  script:
    - make run-sync-full

.e2e-macos:
  #[why] macos remote vms have minimum lease time of 24h, I don't need 24/7 instance running so my local machine polls gitlab pipeline, executes the job and sends results back
  tags: [local]
  image: macos-tahoe-vanilla-base
  resource_group: macos-local-vm
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/configs

dry-run-apply-macos-desktop:
  extends: .e2e-macos
  stage: dry-run-apply
  variables:
    MK_DRY_RUN: all
    CHE_FORCE_PROFILE: desktop/macos
  needs: []
  script:
    - make run-sync-full

apply-macos-cli:
  extends: .e2e-macos
  stage: smoke-apply
  variables:
    CHE_FORCE_PROFILE: cli/macos
    MK_DRY_RUN_RENDER_SECRETS: "true"
    GITLAB_TOKEN: "" #[why] injected (masked) from gitlab ci/cd settings; overrides this default 🤖
  needs: [dry-run-apply-macos-desktop]
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: manual
  script:
    - make run-sync-full

apply-linux-cli:
  extends: .base
  stage: smoke-apply
  variables:
    CHE_FORCE_PROFILE: cli/linux
    MK_DRY_RUN_RENDER_SECRETS: "true"
    GITLAB_TOKEN: "" #[why] injected (masked) from gitlab ci/cd settings; overrides this default 🤖
  needs:
    - job: build-ci-linux-image
      optional: true
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: manual
  before_script:
    ##[>] 🤖🤖
    - chown -R ko "$CI_PROJECT_DIR"
    ##[<] 🤖🤖
  script:
    ##[>] 🤖🤖
    - sudo -u ko --preserve-env=CI,CHE_FORCE_PROFILE,MK_DRY_RUN_RENDER_SECRETS,GITLAB_TOKEN,GOMODCACHE,GOCACHE,CC,GOPATH make -C "$CI_PROJECT_DIR" run-sync-full
    ##[<] 🤖🤖
