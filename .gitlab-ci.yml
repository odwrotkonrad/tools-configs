##[>] 🤖🤖
include:
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file:
      - consumer-repo-config/ci/templates/EmitEvents.gitlab-ci.yml
      - consumer-repo-config/files-generation/templates/FilesTrackedVerify.gitlab-ci.yml
      - consumer-repo-config/ci/templates/UpstreamEnvDrift.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitChanged.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitAll.gitlab-ci.yml
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file: consumer-repo-config/release/templates/TagMint.gitlab-ci.yml
    inputs:
      changes:
        - assets/**/*
        - ci/**/*
        - profiles/**/*
        - .che/**/*
        - Makefile
##[<] 🤖🤖

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - dry-run-apply
  - smoke-apply
  - release
  - notify

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. jobs needing arm64 or another size
#   override with their own tags
#[why] a superseded pipeline holds pods for a commit nobody will merge: cancel it and let
#   the autoscaler release the node. jobs with an external side effect opt out individually
default:
  interruptible: true
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64

##[>] 🤖🤖
variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  CENTRALIZED_ASSETS_GENERIC_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
  CENTRALIZED_ASSETS_PROSE_HUMAN_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_PROSE_HUMAN_REF
  AUTOMATION_REF: $GRP_KO_VAR_AUTOMATION_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  TOOLS_CONFIGS_REF: $GRP_KO_VAR_TOOLS_CONFIGS_REF
  AI_TOOLS_CONFIGS_REF: $GRP_KO_VAR_AI_TOOLS_CONFIGS_REF
  CHE_PACKAGES_REF: $GRP_KO_VAR_CHE_PACKAGES_REF
  ENABLE_DARWIN_CI: $GRP_KO_VAR_ENABLE_DARWIN_CI
  GITLAB_TOKEN: $GRP_KO_UNPROTECTED_VAR_BOT_GITLAB_TOKEN
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF
##[<] 🤖🤖

.base:
  image: $CI_IMAGE
  #[why] rendered here, outside make: under MK_DRY_RUN the recipe wrapper prints `generic-setup`
  #   instead of running it, so the dry-run jobs would never get generic.mk and fail on its targets
  before_script:
    - che render-templates --profiles=generic/setup
  ##[>] 🤖🤖
  variables:
    #[why] set but deliberately never cached: it holds downloaded dependencies, and cache: here
    #   carries intermediates only. it stays because it keeps module downloads inside the project dir
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    CC: clang
  #[why] no packages variables here: autoUpdate defaults to true and the group's CHE_PACKAGES_REF
  #   pins which catalog that fetch resolves. the old CHE_PACKAGES_UPDATE_CHECK sat here long after
  #   che renamed it, doing nothing
  cache:
    - key:
        files:
          - ci/zsh/scripts/installs/00-ci-deps.zsh
      paths:
        - .cache/go-build
  ##[<] 🤖🤖

.as-user:
  extends: .base
  ##[>] 🤖🤖
  variables:
    CI_USER: ko
  before_script:
    - che render-templates --profiles=generic/setup
    #[why] ci-linux carries no user (ko moved to the sandbox image): create it here for the as-user apply
    - useradd -m -s /bin/zsh -G root "$CI_USER" && echo "$CI_USER ALL=(ALL) NOPASSWD:ALL" >"/etc/sudoers.d/$CI_USER"
    - chown -R "$CI_USER" "$CI_PROJECT_DIR"
    #[why] GOPATH is the image's root-owned /usr/local/go-tools: `go install` as ko cannot create pkg/sumdb there, so pre-create the tree and hand it over
    - mkdir -p "$GOPATH/bin" "$GOPATH/pkg" && chown -R "$CI_USER" "$GOPATH"
  ##[<] 🤖🤖

#[why] render secrets dry: the verify renders every tracked template and CI holds no vault credential
generic:files-tracked-verify:
  extends: .base
  tags:
    - gke-linux-amd64-small
  variables:
    MK_DRY_RUN_RENDER_SECRETS: "true"

generic:precommit-changed:
  extends: .base
  tags:
    - gke-linux-amd64-small
  variables:
    MK_DRY_RUN_RENDER_SECRETS: "true"

generic:precommit-all:
  extends: .base
  tags:
    - gke-linux-amd64-small
  variables:
    MK_DRY_RUN_RENDER_SECRETS: "true"

.linux-sync:
  extends: .as-user
  ##[>] 🤖🤖
  variables:
    CHE_PROFILE: virt/linux
    CHE_DEBUG: "1"
    #[why] the runner pod is deleted with the job, so an archive of what che changed outlives
    #   nothing. per anchor, never in the top-level variables: block, which would reach any
    #   job added later that runs che's own suites
    CHE_BACKUP_AUTO_CREATE: $GRP_KO_VAR_CHE_BACKUP_AUTO_CREATE
    MK_DRY_RUN_RENDER_SECRETS: "true"
  needs: []
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  script:
    #[why] CHE_PACKAGES_REF on the list: sudo drops every variable it does not name, so the group's
    #   catalog pin never reached che and the job silently resolved latest instead of the pin
    - sudo -u "$CI_USER" --preserve-env=CI,CI_PIPELINE_SOURCE,CHE_PROFILE,CHE_DEBUG,CHE_VALIDATE_SPEC,CHE_PACKAGES_REF,CENTRALIZED_ASSETS_GENERIC_REF,CENTRALIZED_ASSETS_PROSE_HUMAN_REF,PROSE_SPEC_REF,TOOLS_CONFIGS_REF,AI_TOOLS_CONFIGS_REF,OCI_IMAGES_CI_LINUX_REF,CHE_SCHEMA_REF,AUTOMATION_REF,CHE_BACKUP_AUTO_CREATE,MK_DRY_RUN,MK_DRY_RUN_RENDER_SECRETS,GITLAB_TOKEN,GOMODCACHE,GOCACHE,CC,GOPATH make -C "$CI_PROJECT_DIR" sync-full
  ##[<] 🤖🤖

dry-run-apply-linux:
  extends: .linux-sync
  stage: dry-run-apply
  tags:
    - gke-linux-$ARCH-small
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - profiles/**/*
        - ci/**/*
        - .che/**/*
        - .gitlab-ci.yml
  variables:
    MK_DRY_RUN: all

apply-linux:
  extends: .linux-sync
  stage: smoke-apply
  tags:
    - gke-linux-$ARCH-big
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: manual
      allow_failure: true
      changes:
        - profiles/**/*
        - ci/**/*
        - .che/**/*
        - .gitlab-ci.yml

.e2e-macos:
  ##[>] 🤖🤖
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  variables:
    CHE_DEBUG: "1"
    #[why] the SaaS macOS VM is discarded with the job, so the archive dies with what it protects
    CHE_BACKUP_AUTO_CREATE: $GRP_KO_VAR_CHE_BACKUP_AUTO_CREATE
    MK_DRY_RUN_RENDER_SECRETS: "true"
  script:
    - make sync-full
  ##[<] 🤖🤖

dry-run-apply-macos:
  extends: .e2e-macos
  stage: dry-run-apply
  rules:
    - if: $ENABLE_DARWIN_CI != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - profiles/**/*
        - ci/**/*
        - .che/**/*
        - .gitlab-ci.yml
  variables:
    MK_DRY_RUN: all
  parallel:
    matrix:
      - CHE_PROFILE: [desktop/macos, cli/macos]
  needs: []

apply-macos-cli:
  extends: .e2e-macos
  stage: smoke-apply
  variables:
    CHE_PROFILE: cli/macos
  needs:
    - dry-run-apply-macos
  rules:
    - if: $ENABLE_DARWIN_CI != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - when: on_success
      changes:
        - profiles/**/*
        - ci/**/*
        - .che/**/*
        - .gitlab-ci.yml

emit-events:
  extends: .emit-events
  stage: notify
##[<] 🤖🤖
