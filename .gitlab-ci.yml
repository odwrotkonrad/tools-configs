stages:
  - validate

validate-docsgen:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache tree jq yq
  script:
    - ./ci/scripts/s_generate_yaml_dir_tree > docs/dirs.yml.new
    - |
      if ! diff -u docs/dirs.yml docs/dirs.yml.new; then
        echo "Run `make` to update autogenerated documentation."
        exit 1
      fi
