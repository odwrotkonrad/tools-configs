# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: ..

repo/genfiles:
  include:
    renderTemplates:
      - source: .repo/templates/1-env/local.env.ontoRepo.tpl
        dest:
          - path: .env
            options:
              writeType: mergeUpsert
      - source: .repo/templates/prose-raw
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: agents-onto-host.tpl
            dest: profiles/llm/base/root/_home/.config/ai-agents/templates/AGENTS.md.ontoHost.tpl
          - dest: profiles/llm/base/root/usr/local/scripts/shell/templates-llm
            <<<:
              - source: git-branch-name-suggest.tpl
                dest: git-branch-name-suggest.tmpl.md
              - source: git-commit-msg-suggest.tpl
                dest: git-commit-msg-suggest.tmpl.md
              - source: git-mr-text-suggest.tpl
                dest: git-mr-text-suggest.tmpl.md
      - source: "@gitlab.com/konradodwrot/prose?ref=v0.0.34"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - dest: assets/docs-agents
            <<<:
              - source: //repos/configs/purpose.md
                dest: purpose.md
              - source: //repos/configs/file-naming.md
                dest: file-naming.md
          - dest: assets/data
            <<<:
              - source: //conventions/conventions.md
                dest: conventions.md
              - source: //templates/2-data
                options:
                  skipAutoGeneratedHeader: false
                <<<:
                  - source: /makefile-agents.md.ontoRepo.tpl
                    dest: makefile.agents.md
                  - source: /repo-structure.md.ontoRepo.tpl
                    dest: repo-structure.md
          - source: //shared/license/LICENSE
            dest: LICENSE
          #[why] tagging logic authored once in prose, rendered here untracked: no duplicated script per repo
          - source: //shared/ci
            chmod: "0755"
            <<<:
              - source: /semver-bump.zsh
                dest: ci/semver-bump.zsh
              - source: /tag-mint.zsh
                dest: ci/tag-mint.zsh
          - source: //repos/configs/ai
            <<<:
              - source: /ai-agents-docs
                dest: profiles/llm/base/root/_home/.config/ai-agents/docs
                <<<:
                  - source: /comments.md
                    dest: comments.md
                  - source: /git.md
                    dest: git.md
                  - source: /testing.md
                    dest: testing.md
              - source: /claude-rules
                dest: profiles/llm/claude/root/_home/.config/claude/rules
                <<<:
                  - source: /code/code.md
                    dest: code/code.md
                  - source: /code/go/principles.md
                    dest: code/go/principles.md
                  - source: /code/python/principles.md
                    dest: code/python/principles.md
                  - source: /code/python/python.md
                    dest: code/python/python.md
                  - source: /code/python/scripts.md
                    dest: code/python/scripts.md
                  - source: /code/ruby/principles.md
                    dest: code/ruby/principles.md
                  - source: /code/zsh/zsh.md
                    dest: code/zsh/zsh.md
                  - source: /config/claudecode.md
                    dest: config/claudecode.md
                  - source: /config/git.md
                    dest: config/git.md
                  - source: /config/ssh.md
                    dest: config/ssh.md
                  - source: /config/vscode.md
                    dest: config/vscode.md
                  - source: /config/zsh/functions.md
                    dest: config/zsh/functions.md
                  - source: /config/zsh/zsh.md
                    dest: config/zsh/zsh.md
                  - source: /docs/prose.md
                    dest: docs/prose.md
              - source: /claude-output-styles/interactive-code.md
                dest: profiles/llm/claude/root/_home/.config/claude/output-styles/interactive-code.md
          - source: //repos/configs/templates/3-audience
            options:
              skipAutoGeneratedHeader: false
            <<<:
              - source: /README.md.ontoRepo.tpl
                dest: README.md
              - source: /AGENTS.md.ontoRepo.tpl
                dest:
                  - CLAUDE.md
                  - path: AGENTS.md
                    options:
                      renderReferencedFiles: true
##[<] 🤖🤖
