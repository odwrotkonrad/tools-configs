# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
profilesDefinitions:
  'repo/filesUntracked':
    type: repo-git-untracked
    include:
      renderTemplates:
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/human
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_HUMAN_REF }}"
            filepath: prose/repos/tools-configs/file-naming.md
          dest: assets/docs-agents/file-naming.md
          options:
            skipAutoGeneratedHeader: true

variablesDefinitions:
  profilesVariablesDefinitions:
    repo/filesUntracked:
      CENTRALIZED_ASSETS_PROSE_HUMAN_REF:
        required: true
##[<] 🤖🤖