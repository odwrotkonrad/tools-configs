# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
ontoRepo:
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/cross-repo/misc@${{ var.MISC_REF }}"
        profile: bootstrapCrossRepoCITagging
    makeCopies:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ var.PROSE_ASSETS_REF }}//shared/license/LICENSE"
        dest: LICENSE
    renderTemplates:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ var.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - dest: assets/docs-agents
            <<<:
              - source: //repos/tools-configs/purpose.md
                dest: purpose.md
              - source: //repos/tools-configs/file-naming.md
                dest: file-naming.md
          - dest: assets/data
            <<<:
              - source: //templates/2-data
                options:
                  skipAutoGeneratedHeader: false
                <<<:
                  - source: /makefile-agents.md.ontoRepo.tpl
                    dest: makefile.agents.md
                  - source: /repo-structure.md.ontoRepo.tpl
                    dest: repo-structure.md
          - source: //repos/tools-configs/templates/3-audience
            options:
              skipAutoGeneratedHeader: false
            <<<:
              - source: /README.md.ontoRepo.tpl
                dest: README.md
              - source: /AGENTS.md.ontoRepo.tpl
                dest:
                  - CLAUDE.md
                  - path: AGENTS.md
                    options:
                      renderReferencedFiles: true
##[<] 🤖🤖
