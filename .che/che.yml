# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
include:
  sources:
    - "."
    - .che/repo-git-tracked
    - {source: shared/generic/che, optional: true}

#[why] os-agnostic and ungated, like ontoRepo: indexing reads dirs already on disk, so `make
#   host-index-workspace` refreshes the workspace map with no credential and no network
indexWorkspace:
  options:
    autoDiscover: false
  include:
    profiles:
      - source: "profiles/gitlab"
        profile: gitlab/projects-index

genericSetup:
  options:
    autoDiscover: false
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/centralized/assets/generic@${{ var.CENTRALIZED_ASSETS_GENERIC_REF }}"
        spec: consumer-repo-config
        profile: setup
        variables:
          repo: tools-configs
