- name: no_args
  args: []
  exit: 2

- name: too_many_args
  args: [any, vscode]
  exit: 2

- name: bad_terminal
  args: [emacs]
  exit: 2

- name: config_not_found
  args: [any]
  config: /nonexistent/term-open-files-with.yml
  exit: 10

- name: bad_config
  args: [any]
  bad_config: "any: [unclosed\n"
  exit: 11

- name: network_failed
  args: [any]
  fetch: fail
  exit: 12
