- name: ok_any_uses_base_opener
  args: [any]
  output:
    - go=vim
    - py=vim
    - rb=vim
    - css=vim
    - html=vim
    - json=vim
    - yaml=vim
    - yml=vim
    - rst=vim
    - txt=vim

- name: ok_vscode_overrides_any_keeps_prose
  args: [vscode]
  output:
    - go=code -r
    - py=code -r
    - rb=code -r
    - css=code -r
    - html=code -r
    - json=code -r
    - yaml=code -r
    - yml=code -r
    - rst=vim
    - txt=vim

- name: ok_kitty_partial_override
  args: [kitty]
  output:
    - go=vim
    - py=vim
    - rb=vim
    - css=vim
    - html=vim
    - json=bat
    - yaml=bat
    - yml=bat
    - rst=nvim
    - txt=nvim

- name: err_no_args
  args: []
  exit: 2

- name: err_two_args
  args: [any, vscode]
  exit: 2

- name: err_three_args
  args: [any, vscode, kitty]
  exit: 2

- name: err_unknown_terminal
  args: [emacs]
  exit: 2

- name: err_another_unknown
  args: [vim]
  exit: 2

- name: err_case_sensitive
  args: [Any]
  exit: 2
