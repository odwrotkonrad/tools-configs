- name: ok_exportable_service_emits_var_value
  args: [bar]
  output:
    - BAR_TOKEN=bar_secret_password_value

- name: ok_null_var_emits_raw_value
  args: [foo, foo_one]
  output:
    - foo_one_password_value

- name: ok_whole_service_lists_all_containers
  args: [foo]
  output:
    - foo_one_password_value
    - foo_two_password_value

- name: ok_multiple_fields_per_container
  args: [baz, baz_one]
  output:
    - /VAR_A=baz_one_\w+_value/
    - VAR_B=baz_one_token_value

- name: ok_field_filter_narrows_to_one
  args: [baz, baz_one, token]
  output:
    - VAR_B=baz_one_token_value

- name: ok_service_with_multiple_exportable_containers
  args: [multi]
  output:
    - ONE_TOKEN=multi_one_password_value
    - TWO_TOKEN=multi_two_password_value

- name: ok_user_and_system_configs_are_merged
  args: [bar]
  output:
    - BAR_TOKEN=bar_secret_password_value

- name: err_unknown_service
  args: [nope]
  exit: 12

- name: err_unknown_container
  args: [foo, foo_missing]
  exit: 12

- name: err_unknown_field
  args: [baz, baz_one, nope]
  exit: 12

- name: err_no_args
  args: []
  exit: 2

- name: err_too_many_args
  args: [svc, ctr, fld, extra]
  exit: 2

- name: err_way_too_many_args
  args: [a, b, c, d, e]
  exit: 2
