- name: ok_any_uses_base_opener
  args: [any]
  output:
    - go=vim
    - py=vim
    - rb=vim
    - css=vim
    - html=vim
    - json=vim
    - yaml=vim
    - yml=vim
    - rst=vim
    - txt=vim

- name: ok_vscode_overrides_any_keeps_prose
  args: [vscode]
  output:
    - go=code -r
    - py=code -r
    - rb=code -r
    - css=code -r
    - html=code -r
    - json=code -r
    - yaml=code -r
    - yml=code -r
    - rst=vim
    - txt=vim

- name: ok_kitty_partial_override
  args: [kitty]
  output:
    - go=vim
    - py=vim
    - rb=vim
    - css=vim
    - html=vim
    - json=bat
    - yaml=bat
    - yml=bat
    - rst=nvim
    - txt=nvim

- name: err_no_args
  args: []
  exit: 11

- name: err_two_args
  args: [any, vscode]
  exit: 11

- name: err_three_args
  args: [any, vscode, kitty]
  exit: 11

- name: err_unknown_terminal
  args: [emacs]
  exit: 11

- name: err_another_unknown
  args: [vim]
  exit: 11

- name: err_case_sensitive
  args: [Any]
  exit: 11

- name: ok_last_opener_wins
  config:
    vscode:
      - opener: code -r
        types: [data]
      - opener: code -w
        types: [data]
  args: [vscode]
  output:
    - json=code -w
    - yaml=code -w
    - yml=code -w

- name: err_missing_config
  no_config: true
  args: [any]
  exit: 13

- name: err_invalid_config
  config_raw: "any: [unclosed\n"
  args: [any]
  exit: 12
