- name: ok_single_app_single_role
  config:
    com.example.Editor:
      all: [public.python-script, public.json]
  output:
    - com.example.Editor public.python-script all
    - com.example.Editor public.json all

- name: ok_one_app_multiple_roles
  config:
    com.example.Viewer:
      all: [com.adobe.pdf]
      viewer: [com.microsoft.word.doc]
  output:
    - com.example.Viewer com.adobe.pdf all
    - com.example.Viewer com.microsoft.word.doc viewer

- name: ok_multiple_apps
  config:
    com.a.One:
      all: [public.json]
    com.b.Two:
      editor: [public.yaml]
  output:
    - com.a.One public.json all
    - com.b.Two public.yaml editor

- name: ok_empty_config
  config: {}
  output: []

- name: ok_app_with_empty_role_list
  config:
    com.example.Editor:
      all: []
  output: []

- name: err_too_many_args
  args: [one, two]
  exit: 11

- name: err_three_args
  args: [one, two, three]
  exit: 11

- name: err_missing_config
  no_config: true
  exit: 13

- name: err_invalid_config_syntax
  config_raw: "handlers: [unclosed\n"
  exit: 12

- name: err_invalid_config_null_roles
  config_raw: "com.example.Editor: null\n"
  exit: 12
