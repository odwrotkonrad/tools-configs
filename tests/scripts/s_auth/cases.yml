#[≟] output cases: args -> expected stdout lines. mock op yields "<container>_<field>_value".

- name: exportable service emits var=value
  args: [bar]
  out:
    - BAR_TOKEN=bar_secret_password_value

- name: null var emits raw value
  args: [foo, foo_one]
  out:
    - foo_one_password_value

- name: whole service lists all containers
  args: [foo]
  out:
    - foo_one_password_value
    - foo_two_password_value

- name: multiple fields per container
  args: [baz, baz_one]
  out:
    - VAR_A=baz_one_password_value
    - VAR_B=baz_one_token_value

- name: field filter narrows to one
  args: [baz, baz_one, token]
  out:
    - VAR_B=baz_one_token_value

- name: service with multiple exportable containers emits each var=value
  args: [multi]
  out:
    - ONE_TOKEN=multi_one_password_value
    - TWO_TOKEN=multi_two_password_value

- name: user and system configs are merged
  args: [bar]
  out:
    - BAR_TOKEN=bar_secret_password_value
