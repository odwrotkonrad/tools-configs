min_version: 2.1.9

output:
  - summary
  - failure
  - execution_info

pre-commit:
  parallel: false
  jobs:
    - name: ssh-authenticate
      run: /usr/local/scripts/shell/s-rt-ssh-authenticate

    - name: validate-yml
      glob: "*.{yml,yaml}"
      run: yq e '.' {staged_files}

    - name: ruff
      glob: "*.py"
      run: ruff check --select I --fix {staged_files} && ruff format {staged_files} && git add {staged_files}

    - name: mypy
      glob: "root-ln/usr/local/scripts/python/**"
      run: make run-repo-typecheck

    - name: gen-files-fresh
      glob: "{docs/data/dirs.yml,README.md}"
      run: make run-repo-gen-files && git diff --exit-code {staged_files}

commit-msg:
  jobs:
    - name: conventional-prefix
      run: /usr/local/scripts/shell/s-rt-conventional-prefix {1}
