profiles:
  cli:
    macos:
  desktop:
    macos:

base:
  include:
    link:
      - HOME/.config/zsh/**
      - HOME/.config/git/**
      - etc/zshrc
      - etc/zsh/**
    copy:
      - HOME/.config/zsh/**
      - Library/LaunchDaemons/otelcol.plist*
    template:
      - HOME/.config/zsh/**

cli/macos:
  mixin-profiles: [base]

desktop/macos:
  mixin-profiles: [base]
