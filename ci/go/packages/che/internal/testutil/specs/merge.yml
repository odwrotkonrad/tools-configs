profiles:
  desktop:
    macos:
  cli:
    macos:
    linux:

base:
  include:
    link:
      - etc/zshrc
      - HOME/.config/zsh/**
      - etc/grafana/**
    mkdirs:
      - HOME/.cache/zsh
      - dest: [{path: /var/log/grafana}]
        chmod: "2775"
    install:
      - ci/zsh/scripts/installs/10-brew.zsh
      - ci/zsh/scripts/installs/20-kitty.zsh
    services: [otelcol, port-exporter, grafana, prometheus]

base-exclude-desktop:
  exclude:
    link:
      - etc/grafana/**
    mkdirs:
      - /var/log/grafana
    install:
      - ci/zsh/scripts/installs/20-kitty.zsh
    services: [grafana, prometheus]

desktop/macos:
  mixin-profiles: [base]

cli/macos:
  mixin-profiles: [base, base-exclude-desktop]
