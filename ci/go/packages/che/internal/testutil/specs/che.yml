profiles:
  cli:
    macos:
  desktop:
    macos:

base:
  include:
    link:
      - HOME/.config/zsh/**
      - etc/zshrc
    copy:
      - HOME/.config/zsh/**
      - source: Library/LaunchDaemons/otelcol.plist.host.cp
        dest: [{path: /Library/LaunchDaemons/otelcol.plist}]
        owner: root
        owner-group: wheel
        chmod: "0644"
    template:
      - HOME/.config/zsh/**
    mkdirs:
      - HOME/.cache/zsh
      - dest: [{path: /var/log/che-test-setgid}]
        chmod: "2775"
    install:
      - install/unit
    services: [otelcol]

cli/macos:
  mixin-profiles: [base]

desktop/macos:
  mixin-profiles: [base]
