extends:
  - ~/.config/lefthook/lefthook.yml

pre-commit:
  jobs:
    - name: docsgen
      env:
        MK_DRY_RUN_RENDER_SECRETS: "true"
        MK_DRY_RUN: ""
      run: make repo-render-templates || true

    - name: validate-yml
      glob: "*.{yml,yaml}"
      run: for f in {staged_files}; do yq e '.' "$f" > /dev/null && echo "validated $f" || exit 1; done

pre-push:
  jobs:
    - name: glab-ci-lint
      glob: ".gitlab-ci.yml"
      run: glab ci lint {push_files}
##[<] 🤖
