extends:
  - /Users/ko/.config/lefthook/lefthook.yml

pre-commit:
  jobs:
    - name: docsgen
      run: make run-repo-render-templates && git add docs/data/repo-structure.md README.md

    - name: ruff-scripts
      glob: "root-ln/usr/local/scripts/python/s-*"
      run: /usr/local/bin/python3.14 -m ruff check --select I --fix {staged_files} && /usr/local/bin/python3.14 -m ruff format {staged_files} && git add {staged_files}

    - name: mypy
      glob: "root-ln/usr/local/scripts/python/**"
      run: make run-repo-typecheck

post-commit:
  jobs:
    - name: reload-config
      run: make run-sync-quick

pre-push:
  jobs:
    - name: pytest
      run: make run-repo-tests
