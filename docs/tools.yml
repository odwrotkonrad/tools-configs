- name: asdf
  configs:
    core:
      - root/Users/ko/.config/asdf/
      - root/Users/ko/.tool-versions
    apropos:
      - root/etc/zshenv # ASDF_DATA_DIR, ASDF_CONFIG_FILE
      - root/etc/zshrc # shims on PATH
      - root/Users/ko/.config/zsh/rc.d/01-tools.zsh # completion generation
      - root/Users/ko/.config/zsh/rc.d/00-dirs.zsh # state dir
      - root/etc/zsh/functions/fn_asdf_install
  docs:
    url:
      human:
        - https://asdf-vm.com/guide/introduction.html

- name: claude
  configs:
    core:
      - root/Users/ko/.config/claude/
    apropos:
      - root/Users/ko/.config/zsh/rc.d/01-tools.zsh # CLAUDE_* env vars
  docs:
    url:
      human:
        - https://code.claude.com/docs/en/overview

- name: defaults
  configs:
    core:
      - root/etc/defaults.yml
    apropos:
      - root/usr/local/bin/s_configure_defaults
      - root/Users/ko/Library/LaunchAgents/local.s-configure-defaults.plist
  docs:
    manual:
      - man defaults

- name: direnv
  configs:
    core:
      - root/Users/ko/.config/direnv/
    apropos:
      - root/etc/zsh/rc.d/20-tools.zsh # shell hook
  docs:
    manual:
      - man direnv
    url:
      human:
        - https://direnv.net/docs/installation.html
        - https://direnv.net/docs/hook.html

- name: editorconfig
  configs:
    core:
      - root/Users/ko/.editorconfig
  docs:
    url:
      human:
        - https://editorconfig.org/

- name: fzf
  configs:
    apropos:
      - root/etc/zsh/rc.d/20-tools.zsh # shell integration
  docs:
    manual:
      - man fzf
    url:
      human:
        - https://junegunn.github.io/fzf/
        - https://github.com/junegunn/fzf

- name: git
  configs:
    core:
      - root/Users/ko/.config/git/
    apropos:
      - root/etc/zsh/rc.d/30-aliases.zsh # git aliases
      - root/etc/zsh/functions/fn_ssh_test_git_connection
  docs:
    manual:
      - git(1)
    commands:
      - whatis git
    url:
      human:
        - https://git-scm.com/
        - https://git-scm.com/cheat-sheet
        - https://git-scm.com/docs

- name: go
  configs:
    apropos:
      - root/etc/zshenv # GOPATH
      - root/etc/zshrc # GOPATH/bin, go on PATH
  docs:
    url:
      human:
        - https://go.dev/doc/
        - https://go.dev/ref/spec
        - https://pkg.go.dev/std

- name: homebrew
  configs:
    core:
      - root/Users/ko/.config/homebrew/
    apropos:
      - root/etc/zshenv # PKG_CONFIG_PATH
      - root/etc/zshrc # homebrew dirs on PATH and fpath
  docs:
    manual:
      - brew(1)
    url:
      human:
        - https://brew.sh/
        - https://docs.brew.sh/Manpage

- name: kitty
  configs:
    core:
      - root/Users/ko/.config/kitty/
    apropos:
      - root/etc/zsh/rc.d/30-aliases.zsh # kitten alias
  docs:
    url:
      human:
        - https://sw.kovidgoyal.net/kitty/

- name: man
  configs:
    core:
      - root/etc/man.conf
    apropos:
      - root/etc/zsh/rc.d/30-aliases.zsh # man aliases
  docs:
    manual:
      - man(7)
      - man.conf(5)
      - manpath(1)

- name: nvm
  configs:
    core:
      - root/Users/ko/.nvmrc
    apropos:
      - root/Users/ko/.config/zsh/rc.d/01-tools.zsh # NVM_DIR, sourcing nvm.sh + completion
  docs:
    commands:
      - nvm --help
    url:
      human:
        - https://github.com/nvm-sh/nvm

- name: prettier
  configs:
    core:
      - root/Users/ko/.config/prettier/
  docs:
    url:
      human:
        - https://prettier.io/docs/

- name: pyenv
  configs:
    apropos:
      - root/etc/zshenv # PYENV_ROOT, PYENV_VERSION
      - root/etc/zshrc # PYENV_ROOT/bin on PATH
      - root/etc/zsh/rc.d/20-tools.zsh # pyenv init
  docs:
    manual:
      - pyenv(1)
    url:
      human:
        - https://github.com/pyenv/pyenv

- name: rg
  configs:
    core:
      - root/etc/rg/
    apropos:
      - root/etc/zshenv # RIPGREP_CONFIG_PATH
      - root/etc/zsh/rc.d/20-tools.zsh # completion generation
      - root/etc/zsh/rc.d/30-aliases.zsh # rg aliases, sf_rg
      - root/etc/zsh/functions/fn_load_static_history # uses rg
  docs:
    manual:
      - rg(1)
    url:
      human:
        - https://github.com/BurntSushi/ripgrep
        - https://github.com/BurntSushi/ripgrep/blob/master/GUIDE.md
        - https://www.pcre.org/original/doc/html/pcresyntax.html
        - https://www.debuggex.com/cheatsheet/regex/pcre

- name: ruff
  configs:
    core:
      - root/Users/ko/.config/ruff/
  docs:
    url:
      human:
        - https://docs.astral.sh/ruff/
        - https://docs.astral.sh/ruff/configuration/

- name: ssh
  configs:
    core:
      - root/Users/ko/.ssh/
    apropos:
      - root/etc/zsh/rc.d/30-aliases.zsh # ssh show-config alias
      - root/etc/zsh/functions/fn_ssh_generate_keys
      - root/etc/zsh/functions/fn_ssh_test_git_connection
  docs:
    manual:
      - ssh(1)
      - ssh-add(1)
      - ssh-agent(1)
      - ssh-keygen(1)
      - ssh-keyscan(1)
      - ssh_config(5)
      - ssh-keysign(8)
      - sshd(8)
    commands:
      - whatis ssh

- name: tmux
  configs:
    core:
      - root/Users/ko/.config/tmux/
  docs:
    manual:
      - tmux(1)

- name: vim
  configs:
    core:
      - root/Users/ko/.config/vim/
    apropos:
      - root/etc/zshenv # EDITOR, VISUAL
      - root/Users/ko/.config/zsh/rc.d/00-dirs.zsh # undo dir
  docs:
    url:
      human:
        - https://www.vim.org/
    manual:
      - vim(1)

- name: vscode
  configs:
    core:
      - root/Users/ko/Library/Application Support/Code/User/settings.json
  docs:
    url:
      human:
        - https://code.visualstudio.com/
    files:
      - /Users/ko/.local/share/vim/vim92/doc/

- name: zsh
  configs:
    core:
      - root/Users/ko/.config/zsh/
      - root/etc/zsh/
      - root/etc/zshenv
      - root/etc/zshrc
      - root/etc/zprofile
      - root/etc/zlogin
      - root/etc/zlogout
  docs:
    url:
      human:
        - https://zsh.sourceforge.io/
        - https://zsh.sourceforge.io/Guide/zshguide.html
    manual:
      - zsh(1)
      - zshall(1)
      - zshbuiltins(1)
      - zshcompctl(1)
      - zshcompsys(1)
      - zshcompwid(1)
      - zshexpn(1)
      - zshmodules(1)
      - zshoptions(1)
      - zshparam(1)
      - zshzle(1)
    commands:
      - whatis zsh
